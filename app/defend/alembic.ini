# Alembic owns every Defend schema change (killinchu #399 §1 / spec #401).
# Migrations are numbered and immutable once merged; no ad-hoc ALTER TABLE
# in runtime code. Startup runs `alembic upgrade head` idempotently and
# refuses to serve when code head != database head.

[alembic]
script_location = app/defend/migrations
prepend_sys_path = .
sqlalchemy.url = driver://user:pass@host/dbname  # overridden by DATABASE_URL env at runtime

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
