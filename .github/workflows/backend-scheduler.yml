name: Backend auto-crawl scheduler

# Guards the intel-feed auto-refresh contract (Task #744): the in-process
# scheduler loop must actually fire a crawl on its interval, a forced scrape
# failure must record exactly one honest 'degraded' event (no fabricated
# snapshot/facts), and the overlap guard must never double-start a crawl.
# Drives the real run_crawl / run_crawl_guarded / scheduler loop against a temp
# SQLite DB with a monkeypatched upstream fetch (no network).

on:
  push:
    branches: [main]
    paths:
      - killinchu_backend.py
      - serve.py
      - tests/test_backend_scheduler.py
      - tests/test_operator_mutation_security.py
      - .github/workflows/backend-scheduler.yml
  pull_request:
    branches: [main]
    paths:
      - killinchu_backend.py
      - serve.py
      - tests/test_backend_scheduler.py
      - tests/test_operator_mutation_security.py
      - .github/workflows/backend-scheduler.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-scheduler:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: killinchu_test_password
          POSTGRES_DB: killinchu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d killinchu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install test deps
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio fastapi httpx "psycopg[binary]==3.3.4"
      - name: Run scheduler + operator mutation transaction tests
        env:
          KILLINCHU_TEST_POSTGRES_DSN: postgresql://postgres:killinchu_test_password@127.0.0.1:5432/killinchu_test
        run: >-
          python -m pytest
          tests/test_backend_scheduler.py
          tests/test_operator_mutation_security.py
          -q
