# SPDX-License-Identifier: Apache-2.0
name: Defend plane live contract

on:
  push:
    branches: [main]
    paths:
      - killinchu_defend_plane.py
      - serve.py
      - Dockerfile
      - .github/workflows/hf-sync.yml
      - .github/workflows/defend-live-contract.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: killinchu-defend-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Install exact focused test closure
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "fastapi==0.137.2" "starlette==1.3.1" "httpx==0.28.1" \
            -r requirements-test.txt
          python -m pip check
      - name: Prove source and route assembly
        run: |
          python -m py_compile killinchu_defend_plane.py
          python -m pytest -q tests/test_killinchu_defend_plane.py tests/test_resilience_route_convergence.py
          grep -Fq 'KILLINCHU_DEFEND_PLANE_V1' serve.py
          grep -Fq 'COPY killinchu_defend_plane.py ./killinchu_defend_plane.py' Dockerfile

  live-contract:
    if: github.event_name != 'pull_request'
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for exact Killinchu deployment and verify Defend plane
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://szlholdings-killinchu.hf.space
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          expected = os.environ["EXPECTED_SHA"].lower()

          def read(path, accept="application/json"):
              request = urllib.request.Request(
                  base + path,
                  headers={"Accept": accept, "User-Agent": "szl-defend-live-contract/1.0"},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.status, response.headers.get("content-type", ""), response.read(2_000_000)

          deadline = time.monotonic() + 1_200
          last = "unavailable"
          while time.monotonic() < deadline:
              try:
                  status, kind, raw = read("/api/build-info")
                  body = json.loads(raw)
                  observed = str(body.get("build", {}).get("revision") or body.get("gitSha") or "").lower()
                  last = observed or "unbound"
                  if status == 200 and observed == expected:
                      break
              except Exception as exc:
                  last = f"{type(exc).__name__}: {exc}"
              time.sleep(15)
          else:
              raise SystemExit(f"exact Killinchu deployment did not converge: {last}")

          status, kind, raw = read("/defend", "text/html")
          text = raw.decode("utf-8", errors="replace")
          assert status == 200 and "html" in kind.lower()
          for marker in (
              "Killinchu Defend",
              "Human approval required",
              "effectors disabled",
              "rollback",
          ):
              assert marker.lower() in text.lower(), marker

          status, kind, raw = read("/api/defend/status")
          defend = json.loads(raw)
          assert status == 200 and "json" in kind.lower()
          assert defend["public_product"] == "Killinchu"
          assert defend["capability_plane"] == "Defend"
          assert defend["effectors_enabled"] is False
          assert defend["human_approval_required"] is True
          assert defend["arbitrary_command_execution"] is False

          status, kind, raw = read("/api/defend/source")
          source = json.loads(raw)
          assert status == 200
          assert source["source_repository"] == "szl-holdings/szl-defensive-control-plane"
          assert len(source["source_revision"]) == 40
          assert source["integration_mode"] == "SOURCE_BOUND_PORT"
          print(json.dumps({"state":"VERIFIED","killinchu_revision":expected,"defend":defend,"source":source}, indent=2, sort_keys=True))
          PY
