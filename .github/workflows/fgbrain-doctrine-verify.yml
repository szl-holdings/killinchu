name: Formula-Graph Brain doctrine verifier

# Deploy-agnostic proof that the Formula-Graph Brain organ is correct AT THE SOURCE:
# exercises all 9 fgbrain endpoints by calling the organ's pure functions directly
# (no server / no HF Space needed) and asserts every Doctrine-v11 invariant —
# locked-proven == 8, conjectures never fire green / stay gray, locked canon edges
# frozen under plasticity, hash chain intact, homeostasis leaves locked untouched,
# energy never fabricated, evolution kernel-gate immutable + claim-pinned + drift
# rollback, and all 9 routes register. If this is green, a 404 on a frozen Space is
# a deploy problem, not a code problem.

on:
  push:
    branches: [main]
    paths:
      - "szl_fgbrain.py"
      - "verify_fgbrain.py"
      - ".github/workflows/fgbrain-doctrine-verify.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fgbrain-doctrine-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Organ self-test (asserts every wave's invariants)
        run: python3 szl_fgbrain.py
      - name: Deploy-agnostic doctrine verifier (all 9 endpoints)
        run: python3 verify_fgbrain.py
