name: Synchronize runtime-boundary shared source once

on:
  push:
    branches:
      - sync/runtime-boundary-1994
    paths:
      - .github/workflows/_sync_runtime_boundary_1994_once.yml

permissions:
  contents: write

concurrency:
  group: sync-runtime-boundary-1994
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.repository == 'szl-holdings/killinchu' && github.ref == 'refs/heads/sync/runtime-boundary-1994'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact companion branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sync/runtime-boundary-1994
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Apply exact reviewed shared-source delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          agent = Path('szl_agentic_loop.py')
          text = agent.read_text(encoding='utf-8')
          old = '        run_record = _append_run_record(\n'
          new = '        _append_run_record(\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale run_record assignment, found {text.count(old)}')
          agent.write_text(text.replace(old, new, 1), encoding='utf-8')

          expected = {
              'szl_agentic_loop.py': '2d3805007919a677637bf9750869a2a29c5639feeb9da586534848f677de426c',
              'szl_immune.py': 'fb244b7157ee5d1625f373b71826a12d0a77166ee946708b818dd5a42faa4f51',
          }
          observed = {
              path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
              for path in expected
          }
          if observed != expected:
              raise SystemExit(f'shared-source digest mismatch: {observed!r}')

          manifest = {
              'files': observed,
              'payload_id': 'runtime-boundary-1994',
              'schema': 'szl-shared-source-payload/v1',
          }
          raw = json.dumps(manifest, sort_keys=True, separators=(',', ':')) + '\n'
          Path('.github/shared-source-payload-manifest.json').write_text(raw, encoding='utf-8')
          digest = hashlib.sha256(raw.encode('utf-8')).hexdigest()
          if digest != '8b80511a5f8d10ea0c7b0cdb4e0b9358e72f8df47045b2a0fff5bdf5b41d9ca0':
              raise SystemExit(f'manifest digest mismatch: {digest}')
          print(json.dumps({'files': observed, 'manifest_sha256': digest}, sort_keys=True))
          PY
          python -m py_compile szl_agentic_loop.py szl_immune.py
          python -m pip install --disable-pip-version-check --no-cache-dir ruff==0.16.6
          ruff check szl_agentic_loop.py szl_immune.py --select E9,F
          git diff --check

      - name: Commit verified parity and self-remove
        shell: bash
        run: |
          set -euo pipefail
          branch=sync/runtime-boundary-1994
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git rm -- .github/workflows/_sync_runtime_boundary_1994_once.yml
          git add -- szl_agentic_loop.py .github/shared-source-payload-manifest.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'fix(shared): remove unused run-chain assignment and refresh manifest'
          git push origin "HEAD:refs/heads/$branch"
