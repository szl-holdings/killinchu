name: HF universal frontend v1

on:
  push:
    branches: [main]
    paths:
      - README.md
      - app.py
      - main.py
      - index.html
      - src/**
      - '**/szl-universal-frontend.css'
      - docs/hf-universal-frontend-v1.json
      - docs/HF_UNIVERSAL_FRONTEND_V1.md
      - scripts/apply_hf_universal_frontend_v1.py
      - tests/test_hf_universal_frontend_v1.py
      - .github/workflows/hf-universal-frontend-v1.yml
  pull_request:
    branches: [main]
    paths:
      - README.md
      - app.py
      - main.py
      - index.html
      - src/**
      - '**/szl-universal-frontend.css'
      - docs/hf-universal-frontend-v1.json
      - docs/HF_UNIVERSAL_FRONTEND_V1.md
      - scripts/apply_hf_universal_frontend_v1.py
      - tests/test_hf_universal_frontend_v1.py
      - .github/workflows/hf-universal-frontend-v1.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hf-universal-frontend-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install exact focused test runtime
        run: python3 -m pip install --disable-pip-version-check 'pytest==9.0.3'

      - name: Verify source-native adapter and managed files
        run: |
          python3 -m py_compile scripts/apply_hf_universal_frontend_v1.py
          python3 scripts/apply_hf_universal_frontend_v1.py --check
          python3 -m pytest -q tests/test_hf_universal_frontend_v1.py
