name: Corpus auto-sync notify classification

# Guards the knowledge-corpus auto-sync notify classifier: the notify step in
# knowledge-corpus-autosync.yml must pick exactly one of three Slack/ntfy
# messages (PR opened / BLOCKED by the honesty gate / PR refused — open
# manually) and stay silent on the no-op paths (branch already exists, no
# drift, webhook not configured). Drives the REAL bash classifier extracted
# from the workflow YAML for every outcome, with curl stubbed (no network).

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/knowledge-corpus-autosync.yml
      - tests/test_corpus_autosync_notify.py
      - .github/workflows/corpus-autosync-notify.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/knowledge-corpus-autosync.yml
      - tests/test_corpus_autosync_notify.py
      - .github/workflows/corpus-autosync-notify.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus-autosync-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install test deps
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-core.txt
      - name: Run corpus auto-sync notify classification test
        run: python -m pytest tests/test_corpus_autosync_notify.py -q
