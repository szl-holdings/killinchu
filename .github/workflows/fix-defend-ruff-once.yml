name: Fix Defend Ruff once

on:
  push:
    branches:
      - feat/defend-plane-current-main-20260904
    paths:
      - .github/workflows/fix-defend-ruff-once.yml

permissions:
  contents: write

concurrency:
  group: killinchu-fix-defend-ruff-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/defend-plane-current-main-20260904
          fetch-depth: 0
          persist-credentials: true

      - name: Remove only measured unused imports
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object killinchu_defend_plane.py)" = 3c741595dd256a551f311fe8a9cf82deccef4ab3
          python - <<'PY'
          from pathlib import Path

          path = Path("killinchu_defend_plane.py")
          source = path.read_text(encoding="utf-8")
          for line in ("import html\n", "import time\n"):
              if source.count(line) != 1:
                  raise SystemExit(f"repair target drifted: {line.strip()}")
              source = source.replace(line, "", 1)
          path.write_text(source, encoding="utf-8")
          PY
          python -m py_compile killinchu_defend_plane.py
          ! grep -qx 'import html' killinchu_defend_plane.py
          ! grep -qx 'import time' killinchu_defend_plane.py
          git rm .github/workflows/fix-defend-ruff-once.yml
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/fix-defend-ruff-once.yml killinchu_defend_plane.py "

      - name: Commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add killinchu_defend_plane.py .github/workflows/fix-defend-ruff-once.yml
          git commit -m 'fix(defend): remove unused imports from integrated plane' -m 'Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>'
          git push origin HEAD:feat/defend-plane-current-main-20260904
