name: Sync Vessels consolidation card

on:
  push:
    branches: [main]
    paths:
      - docs/hf-cards/SZLHOLDINGS-vessels.README.md
      - scripts/sync_vessels_consolidation_card.py
      - .github/workflows/hf-sync-vessels-consolidation-card.yml
  workflow_dispatch: {}

concurrency:
  group: killinchu-vessels-consolidation-card
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-reviewed-card:
    name: Publish and byte-verify the reviewed historical card
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse a stale protected-main publication
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Check out exact shared publisher lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/.github
          ref: e3ec47ad2e99a535839afe0f30fefbd8973d52da
          path: shared-hf-publisher
          persist-credentials: false
          fetch-depth: 1

      - name: Build isolated hash-locked publisher environment
        env:
          SHARED_PUBLISHER_SHA: e3ec47ad2e99a535839afe0f30fefbd8973d52da
          SHARED_LOCK_BLOB: 9cc19359ddd5e77556740b66201096b812ef48d9
          PUBLISHER_VENV: ${{ runner.temp }}/hf-vessels-card-publisher
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C shared-hf-publisher rev-parse HEAD)" = "$SHARED_PUBLISHER_SHA"
          test "$(git -C shared-hf-publisher rev-parse HEAD:requirements/hf-publisher.lock)" = "$SHARED_LOCK_BLOB"
          test ! -e "$PUBLISHER_VENV"
          python -I -m venv "$PUBLISHER_VENV"
          PUBLISHER_PYTHON="$PUBLISHER_VENV/bin/python"
          test "$("$PUBLISHER_PYTHON" -I -P -c 'import platform; print(platform.python_version())')" = "3.12.10"
          "$PUBLISHER_PYTHON" -I -P -m pip install \
            --disable-pip-version-check --require-hashes --only-binary=:all: \
            --ignore-installed -r shared-hf-publisher/requirements/hf-publisher.lock
          "$PUBLISHER_PYTHON" -I -P -c \
            'import importlib.metadata as m, huggingface_hub as h, requests; assert m.version("huggingface-hub") == "1.19.0" == h.__version__; assert requests.__version__ == "2.32.5"'
          echo "HF_PUBLISHER_PYTHON=$PUBLISHER_PYTHON" >> "$GITHUB_ENV"

      - name: Publish only the reviewed Vessels README
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_WRITE_TOKEN || secrets.HF_TOKEN || secrets.HUGGINGFACE_TOKEN || secrets.HUGGING_FACE_HUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          "$HF_PUBLISHER_PYTHON" -I -P scripts/sync_vessels_consolidation_card.py

      - name: Upload secret-free publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hf-vessels-consolidation-card-${{ github.run_id }}-${{ github.run_attempt }}
          path: hf-vessels-card-receipt.json
          if-no-files-found: error
          retention-days: 180
