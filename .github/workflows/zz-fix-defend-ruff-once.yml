# SPDX-License-Identifier: Apache-2.0
name: Fix Defend Ruff imports once

"on":
  push:
    branches: [feat/defend-plane-current-main-20260904]
    paths:
      - .github/workflows/zz-fix-defend-ruff-once.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fix-defend-ruff-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Remove only the two proven unused imports
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -xc 'import html' killinchu_defend_plane.py)" -eq 1
          test "$(grep -xc 'import time' killinchu_defend_plane.py)" -eq 1
          sed -i '/^import html$/d; /^import time$/d' killinchu_defend_plane.py
          test "$(grep -xc 'import html' killinchu_defend_plane.py || true)" -eq 0
          test "$(grep -xc 'import time' killinchu_defend_plane.py || true)" -eq 0

      - name: Prove blocking Ruff and focused contracts
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "ruff==0.16.6" \
            "fastapi==0.137.2" \
            "starlette==1.3.1" \
            "httpx==0.28.1" \
            -r requirements-test.txt
          ruff check killinchu_defend_plane.py --select E9,F
          python -m pytest -q \
            tests/test_killinchu_defend_plane.py \
            tests/test_resilience_route_convergence.py

      - name: Commit the exact lint repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add killinchu_defend_plane.py
          git commit --signoff -m "fix(defend): remove proven unused imports"
          git push origin "HEAD:${GITHUB_REF_NAME}"
