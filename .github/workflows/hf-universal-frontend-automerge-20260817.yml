name: HF universal frontend PR auto-merge 2026-08-17

on:
  push:
    branches:
      - fix/hf-universal-frontend-v1-20260817
    paths:
      - .github/workflows/hf-universal-frontend-automerge-20260817.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hf-universal-frontend-automerge-20260817
  cancel-in-progress: false

jobs:
  arm-and-retire:
    if: >-
      github.actor == 'stephenlutar2-hash' &&
      github.ref == 'refs/heads/fix/hf-universal-frontend-v1-20260817'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: fix/hf-universal-frontend-v1-20260817
      SELF_PATH: .github/workflows/hf-universal-frontend-automerge-20260817.yml
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind checkout to event head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Resolve unique bounded PR
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t numbers < <(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$HEAD_BRANCH" \
            --base main \
            --json number \
            --jq '.[].number')
          test "${#numbers[@]}" -eq 1
          number="${numbers[0]}"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' > /tmp/allowed-paths.txt
          import json
          from pathlib import Path
          manifest = json.loads(Path('docs/hf-universal-frontend-v1.json').read_text())
          paths = {
              '.github/workflows/hf-universal-frontend-v1.yml',
              '.github/workflows/hf-universal-frontend-automerge-20260817.yml',
              'README.md',
              'docs/HF_UNIVERSAL_FRONTEND_V1.md',
              'docs/hf-universal-frontend-v1.json',
              'scripts/apply_hf_universal_frontend_v1.py',
              'tests/test_hf_universal_frontend_v1.py',
              manifest['app_file'],
              manifest['css_file'],
          }
          if manifest.get('entry_file'):
              paths.add(manifest['entry_file'])
          print('\n'.join(sorted(paths)))
          PY
          while IFS= read -r path; do
            test -e "$path"
          done < /tmp/allowed-paths.txt
          mapfile -t files < <(gh pr diff "$number" --repo "$GITHUB_REPOSITORY" --name-only)
          for path in "${files[@]}"; do
            if ! grep -Fxq "$path" /tmp/allowed-paths.txt; then
              echo "::error::Unexpected PR path: $path"
              exit 1
            fi
          done
          test ! -e .github/workflows/hf-universal-frontend-materialize-20260817.yml

      - name: Enable protected squash auto-merge
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash

      - name: Retire this controller
        shell: bash
        run: |
          set -euo pipefail
          git rm "$SELF_PATH"
          test "$(git diff --cached --name-only)" = "$SELF_PATH"
          git config user.name 'Stephen P. Lutar Jr.'
          git config user.email 'stephen@szlholdings.com'
          git commit \
            -m 'chore(hf): retire one-shot universal frontend auto-merge' \
            -m 'Signed-off-by: Stephen P. Lutar Jr. <stephen@szlholdings.com>'
          git push origin HEAD:$HEAD_BRANCH
