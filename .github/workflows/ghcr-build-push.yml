name: GHCR Build + Push (immutable commit SHA)
# Builds the root Dockerfile, pushes it by immutable digest, signs, attests, and
# verifies that digest, and only then publishes the commit-bound sha-* tag.
# This publisher runs only for protected main pushes. It never writes latest,
# uds-v0.2.0, or another mutable consumer pointer, including when a run is red.
# Unblocks Warhacker UDS bundle chain (FA-01).
# DCO: Signed-off-by: Yachay <yachay@szlholdings.ai>
on:
  push:
    branches: [main]
# Least-privilege: read-only default at top level; the build-push job escalates
# to the package/OIDC/attestation writes it needs.
permissions:
  contents: read
concurrency:
  group: ghcr-protected-main-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/szl-holdings/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build-push
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Attest build provenance (GitHub Attestations API + Rekor)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # installer v4.1.2; Cosign v3.0.6
      - name: Sign and verify immutable digest (keyless)
        id: signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build-push.outputs.digest }}"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          REF="${IMAGE}@${DIGEST}"
          IDENTITY="${{ github.server_url }}/${{ github.repository }}/.github/workflows/ghcr-build-push.yml@${{ github.ref }}"

          # cosign v3 defaults to OCI 1.1 Sigstore bundles. GHCR currently does
          # not expose this package's referrers endpoint, while the admission
          # gate uses cosign v2.4.1. Emit the interoperable legacy OCI signature
          # object explicitly instead of accepting a locally successful sign.
          cosign sign --yes \
            --upload=true \
            --new-bundle-format=false \
            --use-signing-config=false \
            --registry-referrers-mode=legacy \
            "${REF}"

          cosign verify \
            --new-bundle-format=false \
            --certificate-identity="${IDENTITY}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-ref="${GITHUB_REF}" \
            --certificate-github-workflow-sha="${GITHUB_SHA}" \
            --certificate-github-workflow-trigger="push" \
            "${REF}" | tee cosign-verify.json
          jq -e 'type == "array" and length > 0' cosign-verify.json > /dev/null

          SIGNATURE_COUNT="$(jq 'length' cosign-verify.json)"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "ref=${REF}" >> "${GITHUB_OUTPUT}"
          echo "signature_count=${SIGNATURE_COUNT}" >> "${GITHUB_OUTPUT}"
          {
            echo "### GHCR signature gate"
            printf -- '- Digest: `%s`\n' "${DIGEST}"
            printf -- '- Signed reference: `%s`\n' "${REF}"
            printf -- '- Certificate identity: `%s`\n' "${IDENTITY}"
            printf -- '- OIDC issuer: `%s`\n' "https://token.actions.githubusercontent.com"
            printf -- '- Verified signatures: `%s`\n' "${SIGNATURE_COUNT}"
          } >> "${GITHUB_STEP_SUMMARY}"
      # SLSA L2: write a cosign-NATIVE provenance attestation to GHCR. The
      # actions/attest-build-provenance step above lands the attestation in the
      # GitHub Attestations API + public Rekor (verifiable via `gh attestation
      # verify`), but does NOT produce an OCI referrer that `cosign
      # verify-attestation` reads. This step closes that gap so the deployed
      # image passes `cosign verify-attestation --type slsaprovenance`.
      - name: cosign attest SLSA provenance (registry, cosign-verifiable)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          IMG="ghcr.io/szl-holdings/${{ github.event.repository.name }}"
          DIGEST="${{ steps.build-push.outputs.digest }}"
          # SLSA Provenance v0.2 predicate (matches `cosign ... --type slsaprovenance`,
          # which validates the v0.2 schema with a top-level `builder` field).
          cat > predicate.json <<EOF
          {
            "builder": {
              "id": "${{ github.server_url }}/${{ github.repository }}/.github/workflows/ghcr-build-push.yml@${{ github.ref }}"
            },
            "buildType": "https://actions.github.io/buildtypes/workflow/v1",
            "invocation": {
              "configSource": {
                "uri": "git+${{ github.server_url }}/${{ github.repository }}@${{ github.ref }}",
                "digest": { "sha1": "${{ github.sha }}" },
                "entryPoint": ".github/workflows/ghcr-build-push.yml"
              },
              "environment": {
                "event_name": "${{ github.event_name }}",
                "repository_id": "${{ github.repository_id }}",
                "runner_environment": "github-hosted"
              }
            },
            "metadata": {
              "buildInvocationId": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}",
              "completeness": { "parameters": true, "environment": false, "materials": false },
              "reproducible": false
            },
            "materials": [
              {
                "uri": "git+${{ github.server_url }}/${{ github.repository }}@${{ github.ref }}",
                "digest": { "sha1": "${{ github.sha }}" }
              }
            ]
          }
          EOF
          cosign attest --yes \
            --new-bundle-format=false \
            --use-signing-config=false \
            --type slsaprovenance \
            --predicate predicate.json \
            "${IMG}@${DIGEST}"
      - name: cosign verify-attestation (SLSA L2 honesty gate)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          IMG="ghcr.io/szl-holdings/${{ github.event.repository.name }}"
          DIGEST="${{ steps.build-push.outputs.digest }}"
          IDENTITY="${{ github.server_url }}/${{ github.repository }}/.github/workflows/ghcr-build-push.yml@${{ github.ref }}"
          cosign verify-attestation \
            --new-bundle-format=false \
            --type slsaprovenance \
            --certificate-identity="${IDENTITY}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-ref="${GITHUB_REF}" \
            --certificate-github-workflow-sha="${GITHUB_SHA}" \
            --certificate-github-workflow-trigger="push" \
            "${IMG}@${DIGEST}" > /dev/null
          echo "SLSA L2 verified: cosign verify-attestation passed for ${IMG}@${DIGEST}"
      - name: Publish immutable commit tag after live-main gate
        id: publish
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build-push.outputs.digest }}"
          REF="${IMAGE}@${DIGEST}"
          TAG="sha-${GITHUB_SHA}"

          [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]

          LIVE_MAIN_SHA="$(
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_API_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              | jq -er '.object.sha'
          )"
          [[ "${LIVE_MAIN_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${LIVE_MAIN_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "Stale publisher rejected: live main is ${LIVE_MAIN_SHA}, run head is ${GITHUB_SHA}." >&2
            exit 1
          fi

          INSPECT_ERROR="$(mktemp)"
          if EXISTING_DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' 2>"${INSPECT_ERROR}" | jq -er '.digest')"; then
            if [[ "${EXISTING_DIGEST}" != "${DIGEST}" ]]; then
              echo "Immutable tag collision: ${IMAGE}:${TAG} already resolves to ${EXISTING_DIGEST}; refusing ${DIGEST}." >&2
              exit 1
            fi
            PUBLISH_STATE="already-bound"
          else
            INSPECT_STATUS=$?
            INSPECT_MESSAGE="$(<"${INSPECT_ERROR}")"
            if ! grep -Eqi 'manifest unknown|not found' <<<"${INSPECT_MESSAGE}"; then
              echo "Cannot prove ${IMAGE}:${TAG} is absent; refusing publication." >&2
              printf '%s\n' "${INSPECT_MESSAGE}" >&2
              exit "${INSPECT_STATUS}"
            fi
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "${IMAGE}:${TAG}" \
              "${REF}"
            PUBLISH_STATE="published"
          fi

          RESOLVED="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -er '.digest')"
          if [[ "${RESOLVED}" != "${DIGEST}" ]]; then
            echo "Immutable tag readback mismatch: ${IMAGE}:${TAG} -> ${RESOLVED}; expected ${DIGEST}." >&2
            exit 1
          fi

          echo "${PUBLISH_STATE}: ${IMAGE}:${TAG} -> ${RESOLVED}"
          echo "live_main_sha=${LIVE_MAIN_SHA}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "resolved_digest=${RESOLVED}" >> "${GITHUB_OUTPUT}"
          echo "publication_state=${PUBLISH_STATE}" >> "${GITHUB_OUTPUT}"
          {
            echo "### GHCR immutable publication gate"
            printf -- '- Live protected main: `%s`\n' "${LIVE_MAIN_SHA}"
            printf -- '- Immutable tag: `%s:%s`\n' "${IMAGE}" "${TAG}"
            printf -- '- Exact digest readback: `%s`\n' "${RESOLVED}"
            printf -- '- Publication state: `%s`\n' "${PUBLISH_STATE}"
            echo "- Mutable consumer pointers moved: none."
            echo "- Failure semantics: a red run never writes latest or uds-v0.2.0."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Write immutable release evidence
        run: |
          set -euo pipefail
          jq -n \
            --arg schema "szl.ghcr-immutable-release/v1" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_sha "${GITHUB_SHA}" \
            --arg workflow_ref "${GITHUB_WORKFLOW_REF}" \
            --arg image "${IMAGE}" \
            --arg digest "${{ steps.publish.outputs.resolved_digest }}" \
            --arg immutable_tag "${{ steps.publish.outputs.tag }}" \
            --arg publication_state "${{ steps.publish.outputs.publication_state }}" \
            --arg live_main_sha "${{ steps.publish.outputs.live_main_sha }}" \
            --arg signature_count "${{ steps.signature.outputs.signature_count }}" \
            --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema: $schema,
              verdict: "ACCEPTED",
              observed_at: $observed_at,
              source: {
                repository: $repository,
                sha: $source_sha,
                workflow_ref: $workflow_ref,
                live_main_sha: $live_main_sha
              },
              artifact: {
                image: $image,
                digest: $digest,
                immutable_tag: $immutable_tag,
                publication_state: $publication_state
              },
              verification: {
                signature_count: ($signature_count | tonumber),
                signature_identity: "EXACT_WORKFLOW_REF",
                provenance: "COSIGN_SLSA_VERIFIED",
                registry_storage: "LEGACY_DISCOVERABLE"
              },
              mutable_consumer_pointers_moved: []
            }' > ghcr-release-evidence.json
      - name: Preserve immutable release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-immutable-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ghcr-release-evidence.json
            cosign-verify.json
            predicate.json
          if-no-files-found: error
          retention-days: 30
