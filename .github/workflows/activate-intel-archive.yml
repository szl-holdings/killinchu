name: Activate Killinchu intel archive

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ACTIVATE KILLINCHU INTEL ARCHIVE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: activate-killinchu-intel-archive
  cancel-in-progress: false

jobs:
  activate:
    name: Activate rights-reviewed privacy projection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SPACE_ID: SZLHOLDINGS/killinchu

    steps:
      - name: Require explicit activation confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "ACTIVATE KILLINCHU INTEL ARCHIVE" ]]; then
            echo "::error::confirmation must exactly equal ACTIVATE KILLINCHU INTEL ARCHIVE"
            exit 1
          fi
      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require protected current main
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::activation may run only from refs/heads/main"
            exit 1
          fi
          git fetch --no-tags origin main
          if [[ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::workflow commit is not current protected main"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.1.0
        with:
          python-version: "3.12.10"

      - name: Checkout exact shared publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/.github
          ref: 3dde396da0b2c17722e8b78e9da34057801dce5d
          path: shared-hf-publisher
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact shared hash-locked publisher closure
        env:
          SHARED_PUBLISHER_SHA: 3dde396da0b2c17722e8b78e9da34057801dce5d
          SHARED_LOCK_BLOB: 9cc19359ddd5e77556740b66201096b812ef48d9
          PUBLISHER_VENV: ${{ runner.temp }}/hf-publisher-venv
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C shared-hf-publisher rev-parse HEAD)" = "$SHARED_PUBLISHER_SHA"
          test "$(git -C shared-hf-publisher rev-parse HEAD:requirements/hf-publisher.lock)" = "$SHARED_LOCK_BLOB"
          test ! -e "$PUBLISHER_VENV"
          python -I -m venv "$PUBLISHER_VENV"
          PUBLISHER_PYTHON="$PUBLISHER_VENV/bin/python"
          test "$("$PUBLISHER_PYTHON" -I -P -c 'import platform; print(platform.python_version())')" = "3.12.10"
          "$PUBLISHER_PYTHON" -I -P -m pip install \
            --disable-pip-version-check --require-hashes --only-binary=:all: \
            --ignore-installed -r shared-hf-publisher/requirements/hf-publisher.lock
          "$PUBLISHER_PYTHON" -I -P -c \
            'import importlib.metadata as m, huggingface_hub as h; assert m.version("huggingface-hub") == "1.19.0" == h.__version__'
          echo "HF_PUBLISHER_PYTHON=$PUBLISHER_PYTHON" >> "$GITHUB_ENV"

      - name: Activate and verify Space controls
        env:
          HF_TOKEN: ${{ secrets.HF_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_WRITE_TOKEN is not configured"; exit 1; }
          "$HF_PUBLISHER_PYTHON" -I -P - <<'PY'
          import os
          import secrets

          from huggingface_hub import HfApi

          repo_id = os.environ["SPACE_ID"]
          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)

          existing_secrets = api.get_space_secrets(repo_id, token=token)
          api.add_space_variable(
              repo_id=repo_id,
              key="KILLINCHU_INTEL_ARCHIVE_RIGHTS_APPROVED",
              value="true",
              description=(
                  "Activated from protected main after the source-specific "
                  "rights and privacy contract merged in killinchu#272/#287."
              ),
              token=token,
          )

          key_created = False
          if "KILLINCHU_INTEL_ARCHIVE_PSEUDONYM_KEY" not in existing_secrets:
              pseudonym_key = secrets.token_urlsafe(48)
              print(f"::add-mask::{pseudonym_key}")
              api.add_space_secret(
                  repo_id=repo_id,
                  key="KILLINCHU_INTEL_ARCHIVE_PSEUDONYM_KEY",
                  value=pseudonym_key,
                  description=(
                      "Secret HMAC key for rotating 96-bit archive track "
                      "pseudonyms; generated in GitHub Actions and never logged."
                  ),
                  token=token,
              )
              key_created = True

          variables = api.get_space_variables(repo_id, token=token)
          configured_secrets = api.get_space_secrets(repo_id, token=token)
          rights = variables.get("KILLINCHU_INTEL_ARCHIVE_RIGHTS_APPROVED")
          rights_value = getattr(rights, "value", None)
          if str(rights_value).lower() != "true":
              raise RuntimeError("rights approval variable read-back failed")
          if "KILLINCHU_INTEL_ARCHIVE_PSEUDONYM_KEY" not in configured_secrets:
              raise RuntimeError("pseudonym key metadata read-back failed")

          api.restart_space(repo_id=repo_id, token=token)

          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a", encoding="utf-8") as handle:
              handle.write("## Killinchu intel archive activation\n\n")
              handle.write(f"- Space: `{repo_id}`\n")
              handle.write("- Rights variable: `true` (read-back verified)\n")
              handle.write("- Pseudonym key: present (value never read back)\n")
              handle.write(f"- Pseudonym key created this run: `{key_created}`\n")
              handle.write("- Space restart: requested\n")
          PY
