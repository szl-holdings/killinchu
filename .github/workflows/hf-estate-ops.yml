name: HF estate ops (manual)

# Dispatch-only operator workflow for the SZLHOLDINGS Hugging Face estate.
# Executes the archive waves from docs/HF_SPACES_CONSOLIDATION.md and performs
# Space restarts, using the repo/org HF token secrets. Conventions match the
# lifecycle controller: fail-closed, status-only logging, tokens never printed,
# single org-wide provider-mutation concurrency group.
#
# Ops:
#   probe         - report each token's auth type/role + orgs (read-only)
#   plan-archive  - list the group's Spaces with sdk/visibility/archive state
#   apply-archive - archive the group's Spaces, verifying state after each
#   restart-space - restart one exact Space (repo_id input), report runtime stage

on:
  workflow_dispatch:
    inputs:
      op:
        description: Operation to perform
        type: choice
        options:
          - probe
          - plan-archive
          - apply-archive
          - restart-space
          - launch-train-job
          - publish-provenance
        default: probe
      group:
        description: Consolidation group (D-K from the merged plan)
        type: choice
        options:
          - D
          - F
          - G
          - H
          - I
          - K
        default: D
      profile:
        description: Training profile (launch-train-job only)
        type: choice
        options:
          - khipu-frontier-35-2b
          - forge-frontier-35-2b
          - willay-3
        default: khipu-frontier-35-2b
      repo_id:
        description: Exact Space for restart-space, e.g. SZLHOLDINGS/governed-receipt-verifier
        type: string
        required: false
      training_manifest:
        description: Concrete szl.training.v1 JSON bound to this exact main SHA; training only
        type: string
        required: false

permissions:
  contents: read
  checks: read

concurrency:
  group: hf-provider-mutation-szlholdings
  cancel-in-progress: false

jobs:
  hf-estate-ops:
    name: HF estate ops
    if: inputs.op != 'launch-train-job'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Naming an environment here is only a source control. Required reviewers
    # and deployment protection rules must be verified in GitHub before use.
    environment: hf-provider-mutation
    env:
      INPUT_OP: ${{ inputs.op }}
      INPUT_GROUP: ${{ inputs.group }}
      INPUT_REPO_ID: ${{ inputs.repo_id }}
      INPUT_PROFILE: ${{ inputs.profile }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Prove dispatch context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = szl-holdings/killinchu
          test "$GITHUB_REF" = refs/heads/main

      - name: Checkout
        if: inputs.op == 'publish-provenance'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run estate op
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
        run: |
          python3 <<'PYEOF'
          import json, os, urllib.request, urllib.error

          ORG = "SZLHOLDINGS"
          GROUPS = {
              "D": ["immune-lattice"],
              "F": ["khipu-lab"],
              "G": ["lyte-services"],
              "H": ["counsel"],
              "I": ["szl-real-estate"],
              "K": ["holographic", "nexus"],
          }

          def call(token, method, path, payload=None):
              req = urllib.request.Request(
                  f"https://huggingface.co{path}",
                  method=method,
                  headers={"Authorization": f"Bearer {token}",
                           "Content-Type": "application/json"},
                  data=json.dumps(payload).encode() if payload is not None else None,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, resp.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]

          op = os.environ["INPUT_OP"]
          group = os.environ["INPUT_GROUP"]
          repo_id_input = (os.environ.get("INPUT_REPO_ID") or "").strip()
          allowed_ops = {
              "probe", "plan-archive", "apply-archive", "restart-space",
              "publish-provenance",
          }
          if op not in allowed_ops:
              print("::error::unsupported operation")
              raise SystemExit(1)
          if op in {"plan-archive", "apply-archive"} and group not in GROUPS:
              print("::error::unsupported consolidation group")
              raise SystemExit(1)
          tokens = {k: v for k, v in {
              "HF_ORG_TOKEN": os.environ.get("HF_ORG_TOKEN") or "",
              "HF_TOKEN": os.environ.get("HF_TOKEN") or "",
          }.items() if v}
          print(f"op={op} group={group} tokens_present={sorted(tokens)}")

          if not tokens:
              print("::error::no HF token secrets available")
              raise SystemExit(1)

          if op == "probe":
              authenticated = False
              for name, tok in tokens.items():
                  status, body = call(tok, "GET", "/api/whoami-v2")
                  if status != 200:
                      print(f"{name}: whoami HTTP {status}")
                      continue
                  authenticated = True
                  data = json.loads(body)
                  auth = data.get("auth", {}) or {}
                  acc = auth.get("accessToken", {}) or {}
                  orgs = [f"{o.get('name')}:{o.get('roleInOrg', '?')}"
                          for o in data.get("orgs", [])]
                  print(f"{name}: type={data.get('type')} auth_type={auth.get('type')} "
                        f"role={acc.get('role')} orgs={orgs}")
              if not authenticated:
                  print("::error::no token authentication was observed")
              raise SystemExit(0 if authenticated else 1)

          # pick the first authenticating token
          chosen = None
          for name, tok in tokens.items():
              status, _ = call(tok, "GET", "/api/whoami-v2")
              if status == 200:
                  chosen = (name, tok)
                  break
          if not chosen:
              print("::error::no token authenticated")
              raise SystemExit(1)
          tname, token = chosen
          print(f"acting with {tname}")

          if op == "publish-provenance":
              import base64, hashlib, re
              content = open("estate/SPACE_PROVENANCE_OBSERVATION.json", "rb").read()
              head_status, head_body = call(token, "GET", "/api/spaces/SZLHOLDINGS/szl-khipu")
              try:
                  parent_commit = json.loads(head_body).get("sha") if head_status == 200 else None
              except (AttributeError, TypeError, ValueError):
                  parent_commit = None
              if not isinstance(parent_commit, str) or re.fullmatch(r"[0-9a-f]{40}", parent_commit) is None:
                  print("::error::could not bind provenance publication to an exact parent")
                  raise SystemExit(1)
              nd = "\n".join([
                  json.dumps({"key": "header", "value": {
                      "summary": "provenance: companion observation post-consolidation (2026-08-31)",
                      "description": "Additive observation; sealed SPACE_PROVENANCE_FRONTIER.json untouched.",
                      "parentCommit": parent_commit}}),
                  json.dumps({"key": "file", "value": {
                      "path": "SPACE_PROVENANCE_OBSERVATION.json",
                      "encoding": "base64",
                      "content": base64.b64encode(content).decode()}}),
              ]) + "\n"
              req = urllib.request.Request(
                  "https://huggingface.co/api/spaces/SZLHOLDINGS/szl-khipu/commit/main",
                  method="POST",
                  headers={"Authorization": f"Bearer {token}",
                           "Content-Type": "application/x-ndjson"},
                  data=nd.encode())
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      print(f"commit HTTP {resp.status}")
                      response_body = resp.read().decode()
              except urllib.error.HTTPError as e:
                  print(f"commit HTTP {e.code}")
                  raise SystemExit(1)
              try:
                  commit_oid = json.loads(response_body).get("commitOid")
              except (AttributeError, TypeError, ValueError):
                  commit_oid = None
              if not isinstance(commit_oid, str) or re.fullmatch(r"[0-9a-f]{40}", commit_oid) is None:
                  print("::error::provenance publication outcome is unknown")
                  raise SystemExit(1)
              s, b = call(token, "GET", f"/api/spaces/SZLHOLDINGS/szl-khipu/tree/{commit_oid}")
              try:
                  entries = json.loads(b) if s == 200 else []
              except (TypeError, ValueError):
                  entries = []
              expected_oid = hashlib.sha1(
                  b"blob " + str(len(content)).encode("ascii") + b"\0" + content
              ).hexdigest()
              matches = [
                  item for item in entries
                  if isinstance(item, dict)
                  and item.get("path") == "SPACE_PROVENANCE_OBSERVATION.json"
              ]
              verified = (
                  len(matches) == 1
                  and matches[0].get("type") == "file"
                  and matches[0].get("size") == len(content)
                  and matches[0].get("oid") == expected_oid
                  and not matches[0].get("lfs")
              )
              print(f"verify exact provenance blob at commit: {verified}")
              raise SystemExit(0 if verified else 1)

          if op == "restart-space":
              if not repo_id_input.startswith(f"{ORG}/"):
                  print("::error::repo_id must be an exact SZLHOLDINGS/<space>")
                  raise SystemExit(1)
              s, b = call(token, "POST", f"/api/spaces/{repo_id_input}/restart")
              print(f"restart {repo_id_input}: HTTP {s}")
              s2, b2 = call(token, "GET", f"/api/spaces/{repo_id_input}")
              if s2 == 200:
                  rt = (json.loads(b2).get("runtime") or {})
                  print(f"verify stage={rt.get('stage')} sdk={json.loads(b2).get('sdk')}")
              raise SystemExit(0 if s in (200, 201, 204) else 1)

          exit_code = 0
          for space in GROUPS[group]:
              rid = f"{ORG}/{space}"
              status, body = call(token, "GET", f"/api/spaces/{rid}")
              if status != 200:
                  print(f"{space}: GET HTTP {status} -> skip")
                  exit_code = 1
                  continue
              info = json.loads(body)
              archived = info.get("archived")
              stage = (info.get("runtime") or {}).get("stage")
              print(f"{space}: sdk={info.get('sdk')} private={info.get('private')} "
                    f"archived={archived} stage={stage} lastModified={info.get('lastModified')}")
              if op == "plan-archive":
                  print(f"{space}: PLAN would set visibility=protected")
                  continue
              if op != "apply-archive":
                  print("::error::archive mutation requires apply-archive")
                  raise SystemExit(1)
              vis = info.get("visibility") or ("private" if info.get("private") else "public")
              if vis == "protected":
                  print(f"{space}: already protected")
                  continue
              s1, b1 = call(token, "PUT", f"/api/spaces/{rid}/settings",
                            {"visibility": "protected"})
              print(f"{space}: visibility=protected PUT -> HTTP {s1}")
              s3, b3 = call(token, "GET", f"/api/spaces/{rid}")
              ok = s3 == 200 and json.loads(b3).get("visibility") == "protected"
              print(f"{space}: verify protected={ok}")
              exit_code = exit_code or (0 if ok else 1)
          raise SystemExit(exit_code)
          PYEOF

  receipt-training:
    name: Source-bound receipt-model training
    if: inputs.op == 'launch-train-job'
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    environment: hf-training
    env:
      INPUT_PROFILE: ${{ inputs.profile }}
      INPUT_TRAINING_MANIFEST: ${{ inputs.training_manifest }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - name: Install pinned dispatch SDK
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r .github/requirements-dispatch.lock
          python -m pip check
      - name: Reserve, submit, monitor and verify candidate
        env:
          HF_TOKEN: ${{ secrets.TRAINING_HF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.dispatch_receipt_training --submit --receipt-dir training-receipts
      - name: Retain sanitized phase receipts, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: training-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: training-receipts/*.json
          if-no-files-found: error
          retention-days: 90
