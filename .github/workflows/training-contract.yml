name: Receipt training contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: training-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r .github/requirements-training-contract.lock
          python -m pip check
      - name: Provider-free worker and lifecycle regressions
        run: python -m pytest -q tests/test_receipt_training_worker.py tests/test_receipt_training_dispatch.py tests/test_receipt_training_runtime_contract.py tests/test_receipt_training_admission.py tests/test_receipt_training_candidate_integrity.py
      - name: Compile source and check patch whitespace
        run: |
          python -m py_compile scripts/receipt_training_worker.py scripts/dispatch_receipt_training.py
          git diff --check
