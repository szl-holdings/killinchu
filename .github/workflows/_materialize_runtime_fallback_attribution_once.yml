# SPDX-License-Identifier: Apache-2.0
name: Materialize runtime fallback attribution once

"on":
  push:
    branches:
      - fix/runtime-fallback-source-attribution-20260905
    paths:
      - .github/workflows/_materialize_runtime_fallback_attribution_once.yml

permissions:
  contents: write

concurrency:
  group: materialize-runtime-fallback-attribution-killinchu
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'szl-holdings/killinchu' && github.ref == 'refs/heads/fix/runtime-fallback-source-attribution-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/runtime-fallback-source-attribution-20260905
          fetch-depth: 0
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Import exact permanent peer source and retire controller
        shell: bash
        env:
          PEER_SHA: 39079362c14f2d01970519cf65932677965072d8
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git merge --no-edit origin/main

          base="https://raw.githubusercontent.com/szl-holdings/a11oy/${PEER_SHA}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "${base}/szl_immune.py" --output szl_immune.py
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "${base}/tests/test_runtime_fallback_source_attribution.py" \
            --output tests/test_runtime_fallback_source_attribution.py
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "${base}/.github/shared-source-payload-manifest.json" \
            --output .github/shared-source-payload-manifest.json

          python -m py_compile \
            szl_immune.py \
            tests/test_runtime_fallback_source_attribution.py
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path('.github/shared-source-payload-manifest.json').read_text(encoding='utf-8')
          )
          assert manifest['schema'] == 'szl-shared-source-payload/v1'
          assert manifest['payload_id'] == 'runtime-boundary-1994-v2'
          assert set(manifest['files']) == {'szl_agentic_loop.py', 'szl_immune.py'}
          PY
          git diff --check

          rm -f -- .github/workflows/_materialize_runtime_fallback_attribution_once.yml
          git add \
            .github/shared-source-payload-manifest.json \
            .github/workflows/_materialize_runtime_fallback_attribution_once.yml \
            szl_immune.py \
            tests/test_runtime_fallback_source_attribution.py
          git commit -s -m "fix(runtime): report bounded fallback source exactly"
          git push origin "HEAD:fix/runtime-fallback-source-attribution-20260905"
