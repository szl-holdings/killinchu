# SPDX-License-Identifier: Apache-2.0
name: Materialize runtime fallback attribution once

on:
  push:
    branches:
      - fix/runtime-fallback-attribution-current-main-20260905
    paths:
      - .github/workflows/_materialize_runtime_fallback_attribution_once.yml

permissions:
  contents: write

concurrency:
  group: materialize-runtime-fallback-attribution-once
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'szl-holdings/killinchu' && github.ref == 'refs/heads/fix/runtime-fallback-attribution-current-main-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact clean branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/runtime-fallback-attribution-current-main-20260905
          fetch-depth: 1
          persist-credentials: true

      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'

      - name: Apply the source-accurate compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_materialize_runtime_fallback_attribution.py

      - name: Prove focused shared runtime boundaries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'fastapi==0.116.1' \
            'pytest==9.0.2' \
            'cryptography==46.0.3'
          python -m py_compile \
            szl_agentic_loop.py \
            szl_immune.py \
            tests/test_runtime_boundary_fallback_attribution.py
          python -m pytest -q tests/test_runtime_boundary_fallback_attribution.py
          manifest_sha="$(sha256sum .github/shared-source-payload-manifest.json | cut -d' ' -f1)"
          python .github/validate-shared-payload.py . . \
            --expected-manifest-sha256="$manifest_sha"
          git diff --check

      - name: Commit only permanent shared files and self-remove
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/runtime-fallback-attribution-current-main-20260905
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git rm -- \
            .github/workflows/_materialize_runtime_fallback_attribution_once.yml \
            scripts/_materialize_runtime_fallback_attribution.py
          git add -- \
            .github/shared-source-payload-manifest.json \
            szl_immune.py \
            tests/test_runtime_boundary_fallback_attribution.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'fix(shared): attribute IMMUNE fallback to its actual source'
          git push origin "HEAD:refs/heads/$branch"
