name: CI

# killinchu — showcase + decoder CI. Validates citation/markdown/governance files
# via the org reusable docs workflow, plus secret scanning and the source-bound
# Defend plane contract now hosted inside the sole public Killinchu runtime.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: szl-holdings/.github/.github/workflows/reusable-docs-ci.yml@4d38db6d5ff8c3d18c8831a4426e8dba6dc80ceb # v1 (.github main)

  secrets:
    uses: szl-holdings/.github/.github/workflows/reusable-secret-scan.yml@4d38db6d5ff8c3d18c8831a4426e8dba6dc80ceb # v1 (.github main)

  defend-contract:
    name: Defend plane — source, workflow, and route contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install exact focused test closure
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "fastapi==0.137.2" \
            "starlette==1.3.1" \
            "httpx==0.28.1" \
            -r requirements-test.txt
          python -m pip check

      - name: Compile and prove Defend consolidation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile killinchu_defend_plane.py
          python -m pytest -q \
            tests/test_killinchu_defend_plane.py \
            tests/test_resilience_route_convergence.py
          grep -Fq 'KILLINCHU_DEFEND_PLANE_V1' serve.py
          grep -Fq 'COPY killinchu_defend_plane.py ./killinchu_defend_plane.py' Dockerfile
          grep -Fq '"/defend"' killinchu_nav_wireup.py
          git diff --check
