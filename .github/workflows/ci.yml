name: CI

# killinchu — showcase + decoder CI. Validates citation/markdown/governance files
# via the org reusable docs workflow, plus secret scanning and the source-bound
# Defend plane contract hosted inside the sole public Killinchu runtime.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: szl-holdings/.github/.github/workflows/reusable-docs-ci.yml@4d38db6d5ff8c3d18c8831a4426e8dba6dc80ceb # v1 (.github main)

  secrets:
    uses: szl-holdings/.github/.github/workflows/reusable-secret-scan.yml@4d38db6d5ff8c3d18c8831a4426e8dba6dc80ceb # v1 (.github main)

  elite-graph-errors:
    name: Elite graph error escaping
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: