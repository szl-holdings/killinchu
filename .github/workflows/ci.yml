name: CI

# killinchu — showcase + decoder CI. Validates citation/markdown/governance files
# via the org reusable docs workflow, plus secret scanning and the source-bound
# Defend plane contract hosted inside the sole public Killinchu runtime.

"on":
  push:
    branches: [main]
  pull_request:
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: szl-holdings/.github/.github/workflows/reusable-docs-ci.yml@4d38db6d5ff8c3d18c8831a4426e8dba6dc80ceb # v1 (.github main)

  secrets:
    uses: szl-holdings/.github/.github/workflows/reusable-secret-scan.yml@4d38db6d5ff8c3d18c8831a4426e8dba6dc80ceb # v1 (.github main)

  elite-graph-errors:
    name: Elite graph error escaping
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify graph error escaping
        run: node --test tests/test_elite_graph_errors.cjs

  landing-presentation:
    name: Served landing presentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: audit

      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.10"

      - name: Install exact presentation qualification runtime
        run: |
          python -m pip install --disable-pip-version-check \
            "starlette==1.3.1" "httpx==0.28.1" "playwright==1.60.0"
          python -m playwright install --with-deps chromium

      - name: Render the composed source with unavailable local fixtures
        run: |
          python tools/verify_landing_browser.py --output "$RUNNER_TEMP/landing-presentation"
          git diff --check

      - name: Retain unsigned frontend observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: served-landing-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/landing-presentation/
          if-no-files-found: warn
          retention-days: 14

  defend-contract:
    name: Defend plane — source, workflow, and route contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"

      - name: Install exact focused test closure
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "fastapi==0.137.2" \
            "starlette==1.3.1" \
            "httpx==0.28.1" \
            -r requirements-test.txt
          python -m pip check

      - name: Compile and prove Defend consolidation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            killinchu_ledger.py \
            killinchu_ledger_sqlite.py \
            killinchu_receipt_export.py \
            killinchu_defend_plane.py \
            serve.py \
            deploy/space/serve.py \
            app/defend/*.py
          python -m pytest -q \
            tests/test_killinchu_ledger_runtime.py \
            tests/test_killinchu_ledger_sqlite.py \
            tests/test_killinchu_ledger_recovery.py \
            tests/test_receipt_export_contract.py \
            tests/test_killinchu_defend_plane.py \
            tests/test_resilience_route_convergence.py \
            tests/test_defend_*.py
          grep -Fq 'KILLINCHU_DEFEND_PLANE_V1' serve.py
          grep -Fq 'KILLINCHU_DEFEND_PLANE_V1' deploy/space/serve.py
          grep -Fq 'COPY killinchu_defend_plane.py ./killinchu_defend_plane.py' Dockerfile
          grep -Fq 'COPY killinchu_defend_plane.py ./killinchu_defend_plane.py' deploy/space/Dockerfile
          grep -Fq '"/defend"' killinchu_defend_plane.py
          git diff --check

  assurance-credential:
    name: Assurance credential — active verifying key contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"

      - name: Install focused HTTP and signing test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "fastapi==0.137.2" "starlette==1.3.1" "httpx==0.28.1" \
            "cryptography==49.0.0" "pytest==9.0.3"
          python -m pip check

      - name: Verify credential and real ephemeral attestations
        env:
          KILLINCHU_ROOT: ${{ github.workspace }}
          KILLINCHU_LEDGER_MODE: EPHEMERAL
          SZL_KHIPU_DIR: ${{ runner.temp }}/killinchu-passive-be
          KILLINCHU_DB_DIR: ${{ runner.temp }}/killinchu-passive-backend
        run: >-
          python -m pytest -q -p tests.backend_read_offline
          tests/test_assurance_credential.py
          tests/test_backend_passive_reads.py
          tests/test_be_hardening.py
          tests/test_killinchu_ledger_attribution.py
          tests/test_killinchu_passive_get.py
          tests/test_roe_decisions_api.py
          tests/test_after_action_bundle.py
          tests/test_dsse_real_signing.py
          tests/test_provenance_standalone.py

  alert-redaction-and-shared-imports:
    name: Alert redaction, SCAP recording + shared import compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"

      - name: Install the hash-locked CI core (pytest, PyYAML)
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/ci-core.txt

      # The alert steps of hf-drift-check, killinchu-api-health and
      # knowledge-corpus-autosync must never print the relay's response body
      # (an edge error page echoes the secret webhook path). scap-scan must not
      # push to main or pass green when oscap evaluated no rule; it exports the
      # image and runs oscap as root (OSCAP_PROBE_ROOT). It runs only on
      # main, so its step scripts are exercised here. The shared import test
      # was red on main from #553 on because no workflow ran it.
      - name: Alert-step redaction, SCAP recording and shared import compatibility (blocking)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_alert_webhook_redaction.py
          tests/test_scap_scan_workflow.py
          tests/test_shared_managed_import_compatibility.py

  mavlink-decoder:
    name: MAVLink decoder — CRC rejection contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"

      # Same pin the runtime image installs; the grep keeps the two in lockstep.
      - name: Install the image's pymavlink pin
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"pymavlink==2.4.50"' Dockerfile
          grep -Fq '"pymavlink==2.4.50"' deploy/space/Dockerfile
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "pymavlink==2.4.50" \
            -r requirements-test.txt
          python -m pip check

      - name: Prove bad-CRC frames are rejected, never decoded
        run: python -m pytest -q tests/test_mavlink_parse_crc_honesty.py