name: CodeQL

# killinchu is a public Python service with GitHub code scanning enabled. Analyze
# both the runtime and workflows, and upload SARIF so fixed alerts can close on
# the exact commit that removed their dataflows.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:${{ matrix.language }}"

  security-regressions:
    name: High-severity security regressions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused test dependencies
        run: >-
          python -m pip install
          "pytest>=8,<9"
          "defusedxml==0.7.1"
          "fastapi>=0.111,<1"
          "httpx>=0.27,<1"
      - name: Compile changed security modules
        run: >-
          python -m py_compile
          killinchu_cot_interop.py
          serve.py
          deploy/space/serve.py
          szl_content_address.py
          szl_safe_static.py
          szl_dsse.py
          szl_connectors/base.py
          szl_connectors/governance.py
          szl_connectors/oauth.py
          szl_killinchu_cookbook.py
      - name: Run adversarial regressions
        run: >-
          python -m pytest -q
          tests/test_codeql_high_security.py
          test_killinchu_cot_interop.py
