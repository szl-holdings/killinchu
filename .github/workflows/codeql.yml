name: CodeQL

# killinchu is a public Python service with GitHub code scanning enabled. Analyze
# both the runtime and workflows, and upload SARIF so fixed alerts can close on
# the exact commit that removed their dataflows.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  security-regressions:
    name: High-severity security regressions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install --require-hashes -r .github/requirements/ci-codeql.txt
      - name: Compile changed security modules
        run: >-
          python -m py_compile
          killinchu_cot_interop.py
          serve.py
          deploy/space/serve.py
          szl_content_address.py
          szl_safe_static.py
          szl_dsse.py
          szl_connectors/base.py
          szl_connectors/governance.py
          szl_connectors/oauth.py
          szl_killinchu_cookbook.py
      - name: Run adversarial regressions
        run: >-
          python -m pytest -q
          tests/test_codeql_high_security.py
          test_killinchu_cot_interop.py
