name: CodeQL

# killinchu is a public Python service with GitHub code scanning enabled. Analyze
# both the runtime and workflows, and upload SARIF so fixed alerts can close on
# the exact commit that removed their dataflows.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"

  security-regressions:
    name: High-severity security regressions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install --require-hashes -r .github/requirements/ci-codeql.txt
      - name: Compile changed security modules
        run: >-
          python -m py_compile
          killinchu_cot_interop.py
          serve.py
          deploy/space/serve.py
          szl_content_address.py
          szl_safe_static.py
          szl_dsse.py
          szl_connectors/base.py
          szl_connectors/governance.py
          szl_connectors/oauth.py
          szl_killinchu_cookbook.py
      - name: Run adversarial regressions
        run: >-
          python -m pytest -q
          tests/test_codeql_high_security.py
          test_killinchu_cot_interop.py
