# SPDX-License-Identifier: Apache-2.0
name: install-check

# Proves the plain `pip install -r requirements.txt` works from a clean
# interpreter, and that what it is meant to provide actually imports.
# Regression guard: requirements.txt once named vsp-otel, which is on no package
# index, so the install died with "No matching distribution found for
# vsp-otel>=0.1". The vsp_otel package serve.py imports is the vendored copy
# under ./vsp_otel/; requirements.txt is a partial list (primary runtime deps
# are pinned in the Dockerfile), so this gate does not import serve.py.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requirements:
    name: Fresh venv - pip install -r requirements.txt (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: pip install -r requirements.txt in a fresh venv
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/req-venv"
          "$RUNNER_TEMP/req-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir -r requirements.txt
          "$RUNNER_TEMP/req-venv/bin/python" -m pip check

      - name: Import smoke test
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/req-venv/bin/python" - <<'PY'
          import importlib.metadata as md
          import pathlib
          import sys

          # serve.py runs from the repo root (Dockerfile WORKDIR /app).
          root = pathlib.Path.cwd().resolve()
          sys.path.insert(0, str(root))

          # 1. serve.py's `from vsp_otel.middleware import install` must resolve to
          #    the vendored copy, not to anything pip put in site-packages.
          import vsp_otel
          import vsp_otel.middleware as vsp_mw

          origin = pathlib.Path(vsp_otel.__file__).resolve()
          assert origin.parent == root / "vsp_otel", f"vsp_otel resolved to {origin}"
          assert callable(vsp_mw.install)
          tp = vsp_mw.make_traceparent()
          parsed = vsp_mw.parse_traceparent(tp)
          assert parsed and parsed["trace_id"] == tp.split("-")[1], tp

          # 2. szl-receipt is the installed package killinchu_engagement_receipt
          #    prefers; exercise a real sign/verify round trip.
          import szl_receipt

          priv, pub = szl_receipt.generate_keypair()
          env = szl_receipt.sign_receipt(
              szl_receipt.Receipt("install-check", {"ok": True}), priv, organ="killinchu"
          )
          ok, why = szl_receipt.verify_receipt(env, pub)
          assert ok, why

          # 3. defusedxml backs killinchu_cot_interop, which imports with only
          #    requirements.txt installed (its FastAPI import is guarded).
          from defusedxml.common import DefusedXmlException  # noqa: F401
          import killinchu_cot_interop  # noqa: F401

          print("vsp_otel (vendored)", vsp_otel.__version__, "->", origin)
          print("szl-receipt-dsse", md.version("szl-receipt-dsse"), "->", szl_receipt.__file__)
          print("defusedxml", md.version("defusedxml"))
          PY

      - name: Receipt tests against the installed szl-receipt-dsse (never skipped)
        run: |
          set -euo pipefail
          # A sign/verify round trip through one implementation cannot see a PAE
          # mismatch: szl-receipt v0.2.0 passed it while the vendored fallback
          # rejected its envelopes. tests/test_engagement_receipt.py cross-verifies
          # installed and vendored in both directions and skips that test when the
          # library is absent, so any skip fails this step. Its import chain
          # (killinchu_edge_formulas -> szl_shared_formulas.kalman) needs numpy,
          # which requirements.txt leaves to the Dockerfile, so the image's single
          # numpy pin is installed here instead of a second copy of it.
          numpy_pin=$(grep -oE 'numpy==[0-9][0-9.]*' Dockerfile | sort -u || true)
          if [ "$(printf '%s\n' "$numpy_pin" | grep -c .)" != "1" ]; then
            echo "::error::expected exactly one numpy pin in Dockerfile, found: ${numpy_pin:-none}"
            exit 1
          fi
          "$RUNNER_TEMP/req-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir pytest==9.2.0 "$numpy_pin"
          "$RUNNER_TEMP/req-venv/bin/python" -m pytest -q -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/receipt-tests.xml" tests/test_engagement_receipt.py
          "$RUNNER_TEMP/req-venv/bin/python" - "$RUNNER_TEMP/receipt-tests.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tot = {k: sum(int(s.get(k, 0)) for s in suites)
                 for k in ("tests", "failures", "errors", "skipped")}
          print("receipt tests:", tot)
          if tot["tests"] < 9 or tot["failures"] or tot["errors"] or tot["skipped"]:
              sys.exit("::error::tests/test_engagement_receipt.py must run all 9 tests "
                       "against the installed library, none failed or skipped")
          PY
