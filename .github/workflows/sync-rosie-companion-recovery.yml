name: Synchronize typed-approver-safe Rosie companion

on:
  push:
    branches:
      - fix/sync-rosie-companion-typed-approver-20260722
    paths:
      - .github/workflows/sync-rosie-companion-recovery.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-rosie-companion-typed-approver
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Killinchu recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/killinchu
          ref: fix/sync-rosie-companion-typed-approver-20260722
          path: self
          fetch-depth: 0

      - name: Checkout immutable hardened A11oy authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/a11oy
          ref: 725cf63a52ca4e93d4d8403a1cc81eb365480963
          path: authority
          persist-credentials: false

      - name: Copy exact hardened module and prove the authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          cp authority/szl_rosie_companion.py self/szl_rosie_companion.py
          cmp --silent authority/szl_rosie_companion.py self/szl_rosie_companion.py
          python -m py_compile self/szl_rosie_companion.py
          python - <<'PY'
          import hashlib
          import importlib.util
          from pathlib import Path

          authority = Path('authority/szl_rosie_companion.py').read_bytes()
          candidate = Path('self/szl_rosie_companion.py').read_bytes()
          assert candidate == authority
          assert hashlib.sha256(candidate).hexdigest() == hashlib.sha256(authority).hexdigest()

          spec = importlib.util.spec_from_file_location('rosie_companion_recovery', 'self/szl_rosie_companion.py')
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)

          shadow = module.RosieShadow('killinchu')
          shadow._call_rosie_jack = lambda *args, **kwargs: ({'response_text': 'proposal only', 'lambda_signal': 0.5}, True, 'offline-test')
          proposal = shadow.evolve({'axis_scores': [0.5] * 13}, approvers=['alice', 'bob'])
          assert proposal.requires_two_person_gate is True
          assert proposal.gate_status == 'AWAITING_VERIFIED_2P_YUYAY'
          assert proposal.approvers == []
          meta = proposal.companion_receipt['meta']
          assert meta['approver_claims'] == ['alice', 'bob']
          assert meta['verified_approvers'] == []
          assert meta['typed_names_authorize'] is False
          print('Typed approver names cannot authorize Rosie evolution: PASS')
          PY
          git -C self diff --check

      - name: Commit exact synchronization and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git -C self rm .github/workflows/sync-rosie-companion-recovery.yml
          git -C self add szl_rosie_companion.py
          git -C self config user.name 'github-actions[bot]'
          git -C self config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C self diff --cached --check
          git -C self commit \
            -m 'fix(frontier): sync typed-approver-safe Rosie companion' \
            -m 'Make the shared Killinchu module byte-identical to the hardened A11oy authority so typed names remain unverified claims and cannot satisfy the two-person gate.' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git -C self push origin HEAD:fix/sync-rosie-companion-typed-approver-20260722
