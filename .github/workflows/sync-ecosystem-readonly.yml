name: Sync exact ecosystem read-only module

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/sync-ecosystem-readonly.yml

permissions:
  contents: write

concurrency:
  group: sync-ecosystem-readonly
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_REPOSITORY: szl-holdings/a11oy
      SOURCE_BLOB: abe1e0900ddb221bc64590040996e352477458d1
      TARGET_BRANCH: frontier/ecosystem-readonly-20260722
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact Killinchu feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: frontier/ecosystem-readonly-20260722
          fetch-depth: 0

      - name: Fetch exact reviewed A11oy blob
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${SOURCE_REPOSITORY}/git/blobs/${SOURCE_BLOB}" \
            --jq .content | tr -d '\n' | base64 --decode > /tmp/szl_ecosystem_routes.py
          observed="$(git hash-object /tmp/szl_ecosystem_routes.py)"
          test "$observed" = "$SOURCE_BLOB" || {
            echo "::error::Source blob mismatch: expected ${SOURCE_BLOB}, observed ${observed}"
            exit 1
          }
          mv /tmp/szl_ecosystem_routes.py szl_ecosystem_routes.py

      - name: Verify read-only shared contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile szl_ecosystem_routes.py
          python - <<'PY'
          import szl_ecosystem_routes as module

          def observed(url: str, timeout: float = 12.0):
              if url.endswith('/api/a11oy/v1/honest'):
                  return {'doctrine_lock': {'locked_formula_ids': module.LOCKED8, 'locked_formula_count': 8}}
              if url.endswith('/api/a11oy/v1/lambda'):
                  return {'lambda': 0.7, 'axes': [{'score': 0.95}]}
              if url.endswith('/api/a11oy/v1/restraint/kpi'):
                  return {'tile': 'restraint', 'label': 'CACHED'}
              if url.endswith('/api/killinchu/v1/gov/chapaq-verdict'):
                  return None
              if url.endswith('/api/a11oy/v1/provenance/ledger'):
                  return {'count': 4}
              if url.endswith('/api/killinchu/v1/receipt/ledger'):
                  return {'count': 3}
              return None

          module._get_json = observed
          board = module.build_kpi_board('killinchu')
          assert board['chapaq_verdict'] is None
          assert board['chapaq_source'].startswith('NOT_EVALUATED')
          ledger = module.build_ledger('killinchu')
          assert ledger['read_only'] is True
          assert ledger['cross_app_verify']['same_cosign_chain'] is None
          assert ledger['cross_app_verify']['killinchu_env_on_a11oy'] == 'NOT_EVALUATED'
          assert 'no mint, sign, POST, or persist' in ledger['cross_app_verify']['note']
          PY
          ! grep -Fq 'def _post_json' szl_ecosystem_routes.py
          ! grep -Fq 'method="POST"' szl_ecosystem_routes.py
          grep -Fq 'NOT_EVALUATED' szl_ecosystem_routes.py
          grep -Fq 'GET does not mint, sign, POST, or persist' szl_ecosystem_routes.py
          git diff --check

      - name: Commit exact companion and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-ecosystem-readonly.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add szl_ecosystem_routes.py .github/workflows/sync-ecosystem-readonly.yml
          git commit \
            -m "fix(frontier): keep ecosystem GET routes read-only" \
            -m "Mirror the exact A11oy shared module so Killinchu ecosystem GET endpoints expose existing evidence only and never submit hidden policy, signing, or verification POSTs." \
            -m "Shared-source-peer: szl-holdings/a11oy#1038@a4071e8d9cb14da0eb494f130c0f707ed52faedd" \
            -m "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push origin "HEAD:${TARGET_BRANCH}"
