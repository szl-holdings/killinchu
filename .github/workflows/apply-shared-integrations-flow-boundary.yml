name: Apply Shared Integrations Flow Boundary

on:
  push:
    branches:
      - "fix/shared-integrations-flow-boundary-20260901"
    paths:
      - ".github/workflows/apply-shared-integrations-flow-boundary.yml"

permissions:
  contents: write

concurrency:
  group: apply-shared-integrations-flow-boundary-killinchu
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/shared-integrations-flow-boundary-20260901
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply namespace-scoped runtime binding
