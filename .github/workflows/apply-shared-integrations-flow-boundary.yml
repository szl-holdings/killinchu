name: Apply Shared Integrations Flow Boundary

on:
  push:
    branches:
      - "fix/shared-integrations-flow-boundary-20260901"
    paths:
      - ".github/workflows/apply-shared-integrations-flow-boundary.yml"

permissions:
  contents: write

concurrency:
  group: apply-shared-integrations-flow-boundary-killinchu
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/shared-integrations-flow-boundary-20260901
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply namespace-scoped runtime binding
        run: python scripts/apply_shared_integrations_flow_boundary.py
      - name: Verify focused boundary contract
        run: |
          python -m py_compile szl_connectors_serve.py tests/test_integrations_flow_boundary.py
          python tests/test_integrations_flow_boundary.py -v
          git diff --check
      - name: Retire bounded executor and commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-shared-integrations-flow-boundary.yml
          rm -f scripts/apply_shared_integrations_flow_boundary.py
          git config user.name "SZL Shared Source Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git diff --cached --quiet && { echo "No repair diff produced"; exit 1; }
          git commit -s -m "fix(shared): scope integrations Flow Shell to A11oy runtime"
          git push origin HEAD:fix/shared-integrations-flow-boundary-20260901
