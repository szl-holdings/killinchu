name: Publish Killinchu Intel Archive Card

on:
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
    branches: [main]
    paths:
      - killinchu_osint.py
      - killinchu_intel_archive_card.py
      - killinchu_intel_archive_publish.py
      - datasets/killinchu-osint-corpus/**
      - tests/test_killinchu_intel_archive_card.py
      - tests/test_killinchu_intel_archive_publish.py
      - Dockerfile
      - .github/workflows/publish-intel-archive-card.yml
  push:
    branches: [main]
    paths:
      - killinchu_osint.py
      - killinchu_intel_archive_card.py
      - killinchu_intel_archive_publish.py
      - datasets/killinchu-osint-corpus/**
      - tests/test_killinchu_intel_archive_card.py
      - tests/test_killinchu_intel_archive_publish.py
      - Dockerfile
      - .github/workflows/publish-intel-archive-card.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-killinchu-intel-archive-card-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_REPO: SZLHOLDINGS/killinchu-osint-corpus
  EVIDENCE_DIR: reports/killinchu-intel-archive-card

jobs:
  validate:
    name: Canonical mixed-source card contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact shared publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/.github
          ref: 3dde396da0b2c17722e8b78e9da34057801dce5d
          path: shared-hf-publisher
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install exact shared hash-locked publisher closure
        env:
          SHARED_PUBLISHER_SHA: 3dde396da0b2c17722e8b78e9da34057801dce5d
          SHARED_LOCK_BLOB: 9cc19359ddd5e77556740b66201096b812ef48d9
          PUBLISHER_VENV: ${{ runner.temp }}/hf-card-validator-venv
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C shared-hf-publisher rev-parse HEAD)" = "$SHARED_PUBLISHER_SHA"
          test "$(git -C shared-hf-publisher rev-parse HEAD:requirements/hf-publisher.lock)" = "$SHARED_LOCK_BLOB"
          test ! -e "$PUBLISHER_VENV"
          python -I -m venv "$PUBLISHER_VENV"
          PUBLISHER_PYTHON="$PUBLISHER_VENV/bin/python"
          test "$("$PUBLISHER_PYTHON" -I -P -c 'import platform; print(platform.python_version())')" = "3.12.10"
          "$PUBLISHER_PYTHON" -I -P -m pip install \
            --disable-pip-version-check --require-hashes --only-binary=:all: \
            --ignore-installed -r shared-hf-publisher/requirements/hf-publisher.lock
          "$PUBLISHER_PYTHON" -I -P -c \
            'import importlib.metadata as m, huggingface_hub as h; assert m.version("huggingface-hub") == "1.19.0" == h.__version__'
          echo "HF_PUBLISHER_SITE=$("$PUBLISHER_PYTHON" -I -P -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')" >> "$GITHUB_ENV"
      - name: Render and test the exact source contract
        id: validation
        shell: bash
        run: |
          set +e
          mkdir -p "$EVIDENCE_DIR/rendered"
          {
            set -x
            python -m py_compile \
              killinchu_intel_archive_card.py \
              killinchu_intel_archive_publish.py \
              tests/test_killinchu_intel_archive_card.py \
              tests/test_killinchu_intel_archive_publish.py
            python killinchu_intel_archive_card.py \
              --card-out "$EVIDENCE_DIR/rendered/README.md" \
              --license-out "$EVIDENCE_DIR/rendered/LICENSE.md"
            python -m pip install --disable-pip-version-check pytest
            PYTHONPATH="$HF_PUBLISHER_SITE${PYTHONPATH:+:$PYTHONPATH}" python -m pytest -q \
              tests/test_killinchu_intel_archive_card.py \
              tests/test_killinchu_intel_archive_publish.py
            python - <<'PY'
          from pathlib import Path
          for path in Path('reports/killinchu-intel-archive-card/rendered').iterdir():
              text = path.read_text(encoding='utf-8')
              if '{{' in text or '}}' in text:
                  raise SystemExit(f'unresolved template marker: {path}')
          PY
            git diff --check
          } 2>&1 | tee "$EVIDENCE_DIR/validation.log"
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload complete prerelease evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: killinchu-intel-card-render-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
      - name: Enforce the source contract
        if: always()
        env:
          VALIDATION_EXIT: ${{ steps.validation.outputs.exit_code }}
        run: |
          code="${VALIDATION_EXIT:-2}"
          if [ "$code" -ne 0 ]; then
            echo "::error::Canonical mixed-source card validation failed."
            exit "$code"
          fi

  publish:
    name: Publish one HF commit and verify immutable bytes
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact shared publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/.github
          ref: 3dde396da0b2c17722e8b78e9da34057801dce5d
          path: shared-hf-publisher
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Install exact shared hash-locked publisher closure
        env:
          SHARED_PUBLISHER_SHA: 3dde396da0b2c17722e8b78e9da34057801dce5d
          SHARED_LOCK_BLOB: 9cc19359ddd5e77556740b66201096b812ef48d9
          PUBLISHER_VENV: ${{ runner.temp }}/hf-card-publisher-venv
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C shared-hf-publisher rev-parse HEAD)" = "$SHARED_PUBLISHER_SHA"
          test "$(git -C shared-hf-publisher rev-parse HEAD:requirements/hf-publisher.lock)" = "$SHARED_LOCK_BLOB"
          test ! -e "$PUBLISHER_VENV"
          python -I -m venv "$PUBLISHER_VENV"
          PUBLISHER_PYTHON="$PUBLISHER_VENV/bin/python"
          test "$("$PUBLISHER_PYTHON" -I -P -c 'import platform; print(platform.python_version())')" = "3.12.10"
          "$PUBLISHER_PYTHON" -I -P -m pip install \
            --disable-pip-version-check --require-hashes --only-binary=:all: \
            --ignore-installed -r shared-hf-publisher/requirements/hf-publisher.lock
          "$PUBLISHER_PYTHON" -I -P -c \
            'import importlib.metadata as m, huggingface_hub as h; assert m.version("huggingface-hub") == "1.19.0" == h.__version__'
          echo "HF_PUBLISHER_PYTHON=$PUBLISHER_PYTHON" >> "$GITHUB_ENV"
      - name: Refuse stale manual or scheduled source refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo '::error::Publication source is not the exact current protected main revision.'
            exit 2
          }
      - name: Publish and independently read back the exact revision
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo '::error::HF write token is not configured'; exit 2; }
          "$HF_PUBLISHER_PYTHON" killinchu_intel_archive_publish.py \
            --source-revision "$GITHUB_SHA" \
            --report "$EVIDENCE_DIR/publication.json"
      - name: Upload immutable publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: killinchu-intel-card-publication-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
