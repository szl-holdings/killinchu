name: Publish Killinchu Intel Archive Card

on:
  pull_request:
    branches: [main]
    paths:
      - killinchu_osint.py
      - killinchu_intel_archive_card.py
      - datasets/killinchu-osint-corpus/**
      - tests/test_killinchu_intel_archive_card.py
      - Dockerfile
      - .github/workflows/publish-intel-archive-card.yml
  push:
    branches: [main]
    paths:
      - killinchu_osint.py
      - killinchu_intel_archive_card.py
      - datasets/killinchu-osint-corpus/**
      - tests/test_killinchu_intel_archive_card.py
      - Dockerfile
      - .github/workflows/publish-intel-archive-card.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-killinchu-intel-archive-card-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_REPO: SZLHOLDINGS/killinchu-osint-corpus
  EVIDENCE_DIR: reports/killinchu-intel-archive-card

jobs:
  validate:
    name: Canonical mixed-source card contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Render and test the exact source contract
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/rendered"
          python -m py_compile \
            killinchu_intel_archive_card.py \
            tests/test_killinchu_intel_archive_card.py
          python killinchu_intel_archive_card.py \
            --card-out "$EVIDENCE_DIR/rendered/README.md" \
            --license-out "$EVIDENCE_DIR/rendered/LICENSE.md"
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_killinchu_intel_archive_card.py
          ! grep -R '{{\|}}' "$EVIDENCE_DIR/rendered"
          git diff --check
      - name: Upload prerelease rendered evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: killinchu-intel-card-render-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/rendered
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish one HF commit and verify immutable bytes
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned Hugging Face client
        run: python -m pip install --disable-pip-version-check 'huggingface_hub==1.20.0'
      - name: Publish and independently read back the exact revision
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo '::error::HF write token is not configured'; exit 2; }
          mkdir -p "$EVIDENCE_DIR/rendered"
          python killinchu_intel_archive_card.py \
            --card-out "$EVIDENCE_DIR/rendered/README.md" \
            --license-out "$EVIDENCE_DIR/rendered/LICENSE.md"
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          from huggingface_hub import (
              CommitOperationAdd,
              HfApi,
              hf_hub_download,
          )

          repo = os.environ['HF_REPO']
          token = os.environ['HF_TOKEN']
          root = Path(os.environ['EVIDENCE_DIR'])
          rendered = root / 'rendered'
          expected = {
              'README.md': (rendered / 'README.md').read_bytes(),
              'LICENSE.md': (rendered / 'LICENSE.md').read_bytes(),
          }
          api = HfApi(token=token)
          api.create_repo(
              repo_id=repo,
              repo_type='dataset',
              private=False,
              exist_ok=True,
          )

          current = {}
          for name in expected:
              try:
                  path = hf_hub_download(
                      repo_id=repo,
                      repo_type='dataset',
                      filename=name,
                      revision='main',
                      token=token,
                  )
                  current[name] = Path(path).read_bytes()
              except Exception:
                  current[name] = None

          if all(current[name] == value for name, value in expected.items()):
              revision = api.repo_info(repo_id=repo, repo_type='dataset').sha
              action = 'already_exact'
          else:
              info = api.create_commit(
                  repo_id=repo,
                  repo_type='dataset',
                  operations=[
                      CommitOperationAdd(
                          path_in_repo=name,
                          path_or_fileobj=io.BytesIO(value),
                      )
                      for name, value in expected.items()
                  ],
                  commit_message=(
                      'fix(license): publish source-derived mixed-source contract '
                      f'from {os.environ["GITHUB_SHA"]}'
                  ),
              )
              revision = info.oid
              action = 'published'

          observed = {}
          for name, value in expected.items():
              path = hf_hub_download(
                  repo_id=repo,
                  repo_type='dataset',
                  filename=name,
                  revision=revision,
                  token=token,
                  force_download=True,
              )
              body = Path(path).read_bytes()
              if body != value:
                  raise SystemExit(f'immutable readback mismatch: {name}')
              observed[name] = {
                  'sha256': hashlib.sha256(body).hexdigest(),
                  'bytes': len(body),
              }

          receipt = {
              'schema': 'szl.killinchu-intel-archive-card-publication/v1',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_revision': os.environ['GITHUB_SHA'],
              'hf_repository': repo,
              'hf_revision': revision,
              'action': action,
              'files': observed,
              'status': 'VERIFIED',
              'credential_value_recorded': False,
          }
          root.mkdir(parents=True, exist_ok=True)
          (root / 'publication.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
      - name: Upload immutable publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: killinchu-intel-card-publication-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
