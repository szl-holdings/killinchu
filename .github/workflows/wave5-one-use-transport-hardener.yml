name: Wave 5 one-use transport hardener

on:
  push:
    branches:
      - "feat/asset-sbom-exposure-wave5-20260904"
    paths:
      - ".github/workflows/wave5-one-use-transport-hardener.yml"

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Wave 5 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "feat/asset-sbom-exposure-wave5-20260904"
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Apply streamed transport and bounded resolution
        run: |
          set -euo pipefail
          python scripts/wave5_transport_hardener.py
          # The GitHub Actions token cannot write workflow files. Preserve the
          # permanent CI workflow here; it is promoted separately through the
          # authenticated contents API after source qualification succeeds.
          git checkout -- .github/workflows/asset-exposure-wave5.yml

      - name: Requalify complete Wave 5 contract
        run: |
          set -euo pipefail
          python -m py_compile \
            szl_connectors/asset_exposure.py \
            szl_uds_hardening.py \
            tests/test_asset_exposure_wave5.py \
            scripts/asset_exposure_live_witness.py
          python -m unittest -v tests.test_asset_exposure_wave5
          python - <<'PY'
          from pathlib import Path

          source = Path("szl_connectors/asset_exposure.py").read_text(
              encoding="utf-8"
          )
          required = (
              "async for chunk in request.stream()",
              "MAX_PARALLEL_RESOLVERS = 3",
              "MAX_GLOBAL_RESOLVERS = 4",
              "threading.BoundedSemaphore",
              "_resolve_fusion_batch",
              "_fusion_boundary_valid",
              "resolver violated the defensive evidence boundary",
          )
          for token in required:
              if token not in source:
                  raise SystemExit(f"missing Wave 5 hardening: {token}")
          if "await request.body()" in source:
              raise SystemExit("unbounded request buffering remains")
          PY
          git diff --check

      - name: Commit source-only hardening
        run: |
          set -euo pipefail
          git config user.name "Stephen Lutar"
          git config user.email "stephenlutar2@gmail.com"
          git add \
            szl_connectors/asset_exposure.py \
            tests/test_asset_exposure_wave5.py \
            docs/ASSET_EXPOSURE_WAVE5.md
          git commit -s -m "fix(defend): bound Wave 5 transport and source pressure"
          git push origin HEAD:"feat/asset-sbom-exposure-wave5-20260904"
