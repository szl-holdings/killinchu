# SPDX-License-Identifier: Apache-2.0
name: Resync runtime boundary peer once

"on":
  push:
    branches:
      - sync/runtime-boundary-1994
    paths:
      - .github/workflows/resync-runtime-boundary-1994-once.yml

permissions:
  contents: write

concurrency:
  group: resync-runtime-boundary-1994-once
  cancel-in-progress: true

jobs:
  resync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact Killinchu branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sync/runtime-boundary-1994
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout exact final A11oy peer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/a11oy
          ref: fbe693fbdd2d85f80b92f242e8a454a56bde4b9e
          path: .peer/a11oy
          persist-credentials: false

      - name: Copy exact shared bytes and regenerate manifest
        shell: bash
        run: |
          set -euo pipefail
          cp .peer/a11oy/szl_agentic_loop.py szl_agentic_loop.py
          cp .peer/a11oy/szl_immune.py szl_immune.py
          cmp -s szl_agentic_loop.py .peer/a11oy/szl_agentic_loop.py
          cmp -s szl_immune.py .peer/a11oy/szl_immune.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          files = {
              name: hashlib.sha256(Path(name).read_bytes()).hexdigest()
              for name in ("szl_agentic_loop.py", "szl_immune.py")
          }
          expected = {
              "szl_agentic_loop.py": "2d3805007919a677637bf9750869a2a29c5639feeb9da586534848f677de426c",
              "szl_immune.py": "fb244b7157ee5d1625f373b71826a12d0a77166ee946708b818dd5a42faa4f51",
          }
          if files != expected:
              raise SystemExit(f"unexpected exact-peer hashes: {files}")
          manifest = {
              "files": files,
              "payload_id": "runtime-boundary-1994",
              "schema": "szl-shared-source-payload/v1",
          }
          path = Path(".github/shared-source-payload-manifest.json")
          path.write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          if digest != "8b80511a5f8d10ea0c7b0cdb4e0b9358e72f8df47045b2a0fff5bdf5b41d9ca0":
              raise SystemExit(f"unexpected manifest digest: {digest}")
          print("manifest_sha256=" + digest)
          PY

      - name: Prove syntax and blocking lint
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "ruff==0.16.6"
          python -m py_compile szl_agentic_loop.py szl_immune.py
          ruff check szl_agentic_loop.py szl_immune.py --select E9,F
          git diff --check

      - name: Commit exact payload and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .peer
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git rm .github/workflows/resync-runtime-boundary-1994-once.yml
          git add \
            .github/shared-source-payload-manifest.json \
            szl_agentic_loop.py \
            szl_immune.py
          git diff --cached --check
          git commit -s -m "fix(shared): align final runtime boundary payload"
          git push origin HEAD:sync/runtime-boundary-1994
