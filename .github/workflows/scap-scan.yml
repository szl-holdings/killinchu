name: SCAP STIG Scan

# DISA STIG / SCAP compliance scan on the container image (DoD requirement).
# Runs OpenSCAP (oscap) with the DISA STIG RHEL9 profile against the built image
# root filesystem, produces XCCDF + ARF reports, uploads them as workflow
# artifacts, writes the pass/fail counts to the run summary, and attaches the
# full reports to the GitHub Release on tag.
#
# Nothing here writes to main. main is protected (pull request, signed commits,
# required checks), so the old "commit the summary" step's `git push` was
# rejected on every run from 2026-06-02 on and its `|| echo "push skipped"` hid
# that. The committed .compliance/scap-reports/scan_summary.json is not
# refreshed by CI; the artifact and the run summary are the per-run record.
#
# Author: Yachay <yachay@szlholdings.dev> (DCO signed). ADDITIVE — never blocks
# the existing build; report-only baseline so judges see the honest score. A
# scan that evaluates no rules fails this workflow instead of reporting zeros.
#
# ubuntu-latest (Python 3.14) makes oscap-docker raise tarfile.AbsoluteLinkError
# on UBI absolute symlinks such as etc/alternatives/libnssckbi.so.x86_64. The
# offline fallback then runs oscap as the runner user, and the RPM probe's
# chroot returns EPERM, so no XCCDF results are written. Export with GNU tar
# (it keeps those links) and evaluate as root with OSCAP_PROBE_ROOT. Do not
# report a pass when no rule evaluates as pass or fail.
# Doctrine v11/v12 · SLSA L1 honest · cosign keyid szlholdings-cosign.

on:
  push:
    branches: [main]
    paths: ["Dockerfile", "Dockerfile.ironbank", ".compliance/**", ".github/workflows/scap-scan.yml"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      profile:
        description: "SCAP profile id"
        default: "xccdf_org.ssgproject.content_profile_stig"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scap:
    name: OpenSCAP DISA STIG scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # gh release upload on release events; nothing is pushed
    env:
      SSG_VERSION: "0.1.73"
      PROFILE: ${{ github.event.inputs.profile || 'xccdf_org.ssgproject.content_profile_stig' }}
      IMAGE: "registry.access.redhat.com/ubi9/ubi-minimal:9.4"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes; the release upload authenticates with GH_TOKEN.
          persist-credentials: false

      - name: Install OpenSCAP + SCAP Security Guide
        run: |
          sudo apt-get update
          # openscap-utils (oscap-docker) is omitted on purpose: its extractor
          # aborts on this runner. oscap itself is in openscap-scanner.
          sudo apt-get install -y --no-install-recommends openscap-scanner unzip
          curl -sSL -o ssg.zip \
            "https://github.com/ComplianceAsCode/content/releases/download/v${SSG_VERSION}/scap-security-guide-${SSG_VERSION}.zip"
          unzip -o ssg.zip "scap-security-guide-${SSG_VERSION}/ssg-rhel9-ds.xml" -d .
          mv "scap-security-guide-${SSG_VERSION}/ssg-rhel9-ds.xml" ssg-rhel9-ds.xml

      - name: Pull scan target image
        run: |
          # Pull the public UBI9-minimal base the flagship image inherits from.
          # (Iron Bank registry1.dso.mil variant scans here once Platform One
          # pull credentials arrive — see .compliance/iron_bank_parity.json.)
          docker pull "${IMAGE}"

      - name: Run oscap DISA STIG scan (root, exported rootfs)
        id: scan
        run: |
          # oscap-docker extracts the image with Python tarfile and then runs
          # oscap as the current user. On this runner that extract raises
          # AbsoluteLinkError, and a non-root oscap cannot chroot into the
          # rootfs (EPERM), so the RPM probe never opens the image rpmdb and
          # no results file is written. GNU tar keeps the absolute symlinks.
          # oscap as root, with OSCAP_PROBE_ROOT, is what actually evaluates.
          # oscap exits 2 when rules fail; that is a result, not a crash.
          # Extract as root so uid, gid, device nodes and xattrs match the
          # image. An unprivileged tar rewrites ownership to the runner and
          # the ownership rules then fail for the wrong reason. An empty
          # export is not scanned: an empty tree would fail file and package
          # rules and look like a real score.
          set +e
          mkdir -p .compliance/scap-reports rootfs
          {
            echo "Exporting ${IMAGE}"
            docker rm -f scan-target
            docker create --name scan-target "${IMAGE}"
            docker export scan-target | sudo tar --xattrs --xattrs-include='*' -x -C rootfs
            docker rm -f scan-target
          } > .compliance/scap-reports/scan.log 2>&1
          if [ ! -e rootfs/etc/os-release ] || [ ! -s rootfs/var/lib/rpm/rpmdb.sqlite ]; then
            echo "Image export is not an evaluable rootfs (missing os-release or rpmdb). Refusing to evaluate an empty tree." | tee -a .compliance/scap-reports/scan.log
          else
            echo "Evaluating ${PROFILE} as root with OSCAP_PROBE_ROOT=${PWD}/rootfs" | tee -a .compliance/scap-reports/scan.log
            sudo OSCAP_PROBE_ROOT="$PWD/rootfs" oscap xccdf eval \
              --profile "$PROFILE" \
              --results .compliance/scap-reports/stig-xccdf.xml \
              --results-arf .compliance/scap-reports/stig-arf.xml \
              --report .compliance/scap-reports/stig-report.html \
              ssg-rhel9-ds.xml 2>&1 | tee -a .compliance/scap-reports/scan.log
            # oscap writes the reports as root. The counting step and the
            # artifact upload run as the runner user.
            sudo chown -- "$(id -u):$(id -g)" \
              .compliance/scap-reports/stig-xccdf.xml \
              .compliance/scap-reports/stig-arf.xml \
              .compliance/scap-reports/stig-report.html || true
          fi
          # Count only what oscap wrote. Without XCCDF results there is nothing
          # to count: the counts stay empty (null in the JSON), never a made-up 0.
          PASS=""; FAIL=""; SCORE=""; COMPLETED=false; REASON=""
          if [ -s .compliance/scap-reports/stig-xccdf.xml ]; then
            PASS=$(grep -oE "<result>pass</result>" .compliance/scap-reports/stig-xccdf.xml | wc -l)
            FAIL=$(grep -oE "<result>fail</result>" .compliance/scap-reports/stig-xccdf.xml | wc -l)
            SCORE=$(grep -oE 'maximum="100.000000">[0-9.]+' .compliance/scap-reports/stig-xccdf.xml | head -1 | grep -oE '[0-9.]+$')
            if [ $((PASS + FAIL)) -gt 0 ]; then COMPLETED=true; fi
          fi
          if [ "$COMPLETED" != true ]; then
            if grep -q "chroot failed" .compliance/scap-reports/scan.log 2>/dev/null; then
              REASON="oscap probe chroot was denied, so the exported image was not evaluated. oscap must run as root with OSCAP_PROBE_ROOT set to that rootfs."
            elif grep -q "not an evaluable rootfs" .compliance/scap-reports/scan.log 2>/dev/null; then
              REASON="The image export is not an evaluable rootfs (missing os-release or rpmdb). Refusing to scan an empty tree."
            elif grep -q "AbsoluteLinkError" .compliance/scap-reports/scan.log 2>/dev/null; then
              REASON="Image extract hit tarfile.AbsoluteLinkError on an absolute symlink. Extract with GNU tar, which keeps those links."
            elif [ ! -s .compliance/scap-reports/stig-xccdf.xml ]; then
              REASON="oscap wrote no XCCDF results. See scan.log in the scap-stig-reports artifact."
            else
              REASON="The XCCDF results contain no rule evaluated as pass or fail."
            fi
          fi
          {
            echo "pass=$PASS"
            echo "fail=$FAIL"
            echo "score=$SCORE"
            echo "completed=$COMPLETED"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"
          mkdir -p .compliance/scap-reports
          if [ -n "$REASON" ]; then REASON_JSON="\"$REASON\""; else REASON_JSON=null; fi
          cat > .compliance/scap-reports/scan_summary.json <<JSON
          {"scanner":"OpenSCAP oscap (ubuntu-latest, root, OSCAP_PROBE_ROOT)","content":"scap-security-guide-${SSG_VERSION}",
           "profile":"${PROFILE}","image":"${IMAGE}","scan_completed":${COMPLETED},
           "rules_passed":${PASS:-null},"rules_failed":${FAIL:-null},
           "score_pct":${SCORE:-null},"failure_reason":${REASON_JSON},
           "scanned_at":"$(date -u +%FT%TZ)","commit":"${GITHUB_SHA}"}
          JSON

      - name: Upload SCAP reports (workflow artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scap-stig-reports
          path: .compliance/scap-reports/
          if-no-files-found: error

      # The per-run record is the artifact above plus this run summary; nothing
      # is committed (see the header). A scan that evaluated no rule fails here
      # instead of passing green with zero counts.
      - name: Record the scan outcome in the run summary
        env:
          COMPLETED: ${{ steps.scan.outputs.completed }}
          PASS: ${{ steps.scan.outputs.pass }}
          FAIL: ${{ steps.scan.outputs.fail }}
          SCORE: ${{ steps.scan.outputs.score }}
          REASON: ${{ steps.scan.outputs.reason }}
        run: |
          set -euo pipefail
          {
            echo "### OpenSCAP DISA STIG scan"
            echo ""
            echo "Profile \`${PROFILE}\` · image \`${IMAGE}\` · scap-security-guide ${SSG_VERSION}"
            echo ""
            if [ "${COMPLETED}" = "true" ]; then
              echo "| rules passed | rules failed | score |"
              echo "|---|---|---|"
              echo "| ${PASS} | ${FAIL} | ${SCORE:-not reported} |"
            else
              echo "**No scan result.** oscap evaluated no rule as pass or fail, so there are no counts and no score."
              if [ -n "${REASON}" ]; then
                echo ""
                echo "${REASON}"
              fi
            fi
            echo ""
            echo "Reports, \`scan.log\` and \`scan_summary.json\`: workflow artifact \`scap-stig-reports\`."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${COMPLETED}" != "true" ]; then
            echo "::error title=SCAP scan produced no result::oscap evaluated no rule as pass or fail (no XCCDF results, or none evaluated). ${REASON} No score is reported; see the scan step log."
            exit 1
          fi
          echo "SCAP scan recorded: pass=${PASS} fail=${FAIL} score=${SCORE:-not reported}."

      - name: Attach full SCAP reports to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gzip -k .compliance/scap-reports/stig-xccdf.xml .compliance/scap-reports/stig-arf.xml
          gh release upload "${{ github.event.release.tag_name }}" \
            .compliance/scap-reports/stig-xccdf.xml.gz \
            .compliance/scap-reports/stig-arf.xml.gz \
            .compliance/scap-reports/stig-report.html \
            .compliance/scap-reports/scan_summary.json --clobber
