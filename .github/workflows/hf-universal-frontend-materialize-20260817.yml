name: HF universal frontend materializer 2026-08-17

on:
  push:
    branches:
      - fix/hf-universal-frontend-v1-20260817
    paths:
      - .github/workflows/hf-universal-frontend-materialize-20260817.yml

permissions:
  contents: write

concurrency:
  group: hf-universal-frontend-materialize-20260817
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.actor == 'stephenlutar2-hash' &&
      github.ref == 'refs/heads/fix/hf-universal-frontend-v1-20260817'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_BRANCH: fix/hf-universal-frontend-v1-20260817
      SELF_PATH: .github/workflows/hf-universal-frontend-materialize-20260817.yml
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind checkout to event head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install exact focused test runtime
        run: python3 -m pip install --disable-pip-version-check 'pytest==9.0.3'

      - name: Apply framework-native frontend integration
        run: python3 scripts/apply_hf_universal_frontend_v1.py --apply

      - name: Verify adapter, managed state, and adversarial controls
        run: |
          python3 -m py_compile scripts/apply_hf_universal_frontend_v1.py
          python3 scripts/apply_hf_universal_frontend_v1.py --check
          python3 -m pytest -q tests/test_hf_universal_frontend_v1.py

      - name: Enforce exact generated mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/managed-paths.txt
          import json
          from pathlib import Path
          manifest = json.loads(Path('docs/hf-universal-frontend-v1.json').read_text())
          paths = {'README.md', 'docs/hf-universal-frontend-v1.json', manifest['app_file'], manifest['css_file']}
          if manifest.get('entry_file'):
              paths.add(manifest['entry_file'])
          print('\n'.join(sorted(paths)))
          PY
          while IFS= read -r path; do
            test -e "$path"
          done < /tmp/managed-paths.txt
          unexpected=$(git status --short | awk '{print $2}' | while read -r path; do
            if ! grep -Fxq "$path" /tmp/managed-paths.txt && [ "$path" != "$SELF_PATH" ]; then
              echo "$path"
            fi
          done)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected materialized paths:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Retire materializer and commit exact source repair
        shell: bash
        run: |
          set -euo pipefail
          git rm "$SELF_PATH"
          xargs -d '\n' git add -- < /tmp/managed-paths.txt
          git config user.name 'Stephen P. Lutar Jr.'
          git config user.email 'stephen@szlholdings.com'
          git commit \
            -m 'fix(hf): apply universal mobile frontend v1' \
            -m 'Signed-off-by: Stephen P. Lutar Jr. <stephen@szlholdings.com>'
          git push origin HEAD:$HEAD_BRANCH
