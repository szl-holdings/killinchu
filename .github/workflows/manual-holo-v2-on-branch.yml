name: Install Killinchu Holo-Constellation v2 on Branch

on:
  push:
    branches:
      - design/holographic-space-v2-manual
    paths:
      - ".github/workflows/manual-holo-v2-on-branch.yml"

permissions:
  contents: write

concurrency:
  group: killinchu-holo-v2-manual
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact adapter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: design/holographic-space-v2-manual
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch immutable first-party Holo assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = "https://raw.githubusercontent.com/szl-holdings/a11oy/a8494fc4d40d0918d33d72e64739eedbd4c33803/console/assets"
          target = Path("static/assets")
          target.mkdir(parents=True, exist_ok=True)
          for name in ("szl-holo-v2.css", "szl-holo-v2.js"):
              request = Request(f"{base}/{name}", headers={"User-Agent": "szl-killinchu-holo-adapter/2"})
              with urlopen(request, timeout=30) as response:
                  payload = response.read()
              if len(payload) < 1000:
                  raise SystemExit(f"canonical asset unexpectedly small: {name}")
              (target / name).write_bytes(payload)
          PY

      - name: Bind all source-owned Killinchu SPA documents
        run: |
          python3 - <<'PY'
          from pathlib import Path

          style = '<link rel="stylesheet" href="/assets/szl-holo-v2.css" data-szl-holo-asset="style-v2" />'
          script = '<script src="/assets/szl-holo-v2.js" defer data-szl-holo-asset="script-v2"></script>'
          documents = sorted(Path("static").rglob("*.html"))
          if not documents or Path("static/index.html") not in documents:
              raise SystemExit("Killinchu static SPA front door was not found")
          for path in documents:
              text = path.read_text(encoding="utf-8")
              if "</head>" not in text.lower() or "</body>" not in text.lower():
                  raise SystemExit(f"HTML document has no complete shell: {path}")
              if style not in text:
                  marker = text.lower().rfind("</head>")
                  text = text[:marker] + "  " + style + "\n" + text[marker:]
              if script not in text:
                  marker = text.lower().rfind("</body>")
                  text = text[:marker] + "  " + script + "\n" + text[marker:]
              path.write_text(text, encoding="utf-8", newline="\n")
          print(f"bound_documents={len(documents)}")
          PY

      - name: Prove SPA route and asset ownership
        run: |
          python3 -m py_compile serve.py szl_safe_static.py
          python3 - <<'PY'
          from pathlib import Path
          server = Path("serve.py").read_text(encoding="utf-8")
          assert 'STATIC_DIR = _APP_ROOT / "static"' in server
          assert 'ASSETS_DIR = STATIC_DIR / "assets"' in server
          assert 'INDEX_HTML = STATIC_DIR / "index.html"' in server
          documents = sorted(Path("static").rglob("*.html"))
          for path in documents:
              text = path.read_text(encoding="utf-8")
              assert text.count('data-szl-holo-asset="style-v2"') == 1, path
              assert text.count('data-szl-holo-asset="script-v2"') == 1, path
          assert Path("static/assets/szl-holo-v2.css").stat().st_size > 1000
          assert Path("static/assets/szl-holo-v2.js").stat().st_size > 1000
          PY
          git diff --check

      - name: Commit adapter and remove one-shot controller
        run: |
          set -euo pipefail
          rm .github/workflows/manual-holo-v2-on-branch.yml
          git config user.name "SZL Killinchu Holo Controller"
          git config user.email "stephenlutar2@gmail.com"
          git add static .github/workflows/manual-holo-v2-on-branch.yml
          git commit -s -m "feat(frontend): install Killinchu Holo-Constellation v2"
          git push origin HEAD:design/holographic-space-v2-manual
