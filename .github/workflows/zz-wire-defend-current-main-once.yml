# SPDX-License-Identifier: Apache-2.0
name: Wire Defend into current Killinchu main once

"on":
  push:
    branches: [feat/defend-plane-current-main-20260904]
    paths:
      - .github/workflows/zz-wire-defend-current-main-once.yml
      - scripts/apply_defend_current_main.py
      - killinchu_defend_plane.py
      - tests/test_killinchu_defend_plane.py
      - tests/test_resilience_route_convergence.py
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wire-defend-current-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wire-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require expected source lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/defend-plane-current-main-20260904
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor \
            52b49b1f429331e4d4aad5bc826aac6b7e75923f \
            HEAD

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Apply idempotent same-origin integration
        run: python scripts/apply_defend_current_main.py

      - name: Install focused test closure
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "fastapi==0.137.2" "starlette==1.3.1" "httpx==0.28.1" \
            -r requirements-test.txt
          python -m pip check

      - name: Prove source, route, workflow, and image contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            killinchu_defend_plane.py \
            scripts/apply_defend_current_main.py \
            serve.py \
            deploy/space/serve.py
          python -m pytest -q \
            tests/test_killinchu_defend_plane.py \
            tests/test_resilience_route_convergence.py
          grep -Fq 'KILLINCHU_DEFEND_PLANE_V1' serve.py
          grep -Fq 'KILLINCHU_DEFEND_PLANE_V1' deploy/space/serve.py
          grep -Fq 'COPY killinchu_defend_plane.py ./killinchu_defend_plane.py' Dockerfile
          grep -Fq 'COPY killinchu_defend_plane.py ./killinchu_defend_plane.py' deploy/space/Dockerfile
          git diff --check

      - name: Commit only runtime integration files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            serve.py deploy/space/serve.py \
            Dockerfile deploy/space/Dockerfile \
            killinchu_nav_wireup.py; then
            echo "Runtime integration is already exact."
            exit 0
          fi
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"
          git add \
            serve.py deploy/space/serve.py \
            Dockerfile deploy/space/Dockerfile \
            killinchu_nav_wireup.py
          git diff --cached --check
          git commit --signoff -m "feat(defend): wire source-bound plane into current Killinchu"
          git push origin "HEAD:${GITHUB_REF_NAME}"
