# SPDX-License-Identifier: Apache-2.0
# © 2026 SZL Holdings. Build + push the killinchu container image to GHCR and
# sign it with cosign (keyless, GitHub OIDC + Fulcio + Rekor).
# Commit DCO-signed: git commit -s -m "ci(killinchu): add build-uds-image workflow"
name: build-uds-image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'image tag'
        required: true
        default: 'uds-v0.2.0'
# Least-privilege: read-only default at top level; the build job escalates to
# the package/OIDC writes it needs to push + sign the image.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ghcr.io/szl-holdings/${{ github.event.repository.name }}:${{ inputs.tag }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: cosign sign
        run: cosign sign --yes ghcr.io/szl-holdings/${{ github.event.repository.name }}:${{ inputs.tag }}
        env:
          COSIGN_EXPERIMENTAL: "1"
