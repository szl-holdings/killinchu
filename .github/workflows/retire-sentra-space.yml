# SPDX-License-Identifier: Apache-2.0
name: Retire former Sentra Space after Defend parity

on:
  push:
    branches: [main]
    paths:
      - scripts/retire_sentra_space.py
      - .github/workflows/retire-sentra-space.yml
      - killinchu_defend_plane.py
      - docs/DEFEND_PLANE_MIGRATION_RECEIPT.json
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: retire-former-sentra-space
  cancel-in-progress: false

jobs:
  snapshot-delete-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
      RETIREMENT_RECEIPT_PATH: sentra-retirement-receipt.json
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout exact protected-main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require current protected main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Install exact Hub client and compile operator
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "huggingface_hub==1.23.0"
          python -m py_compile scripts/retire_sentra_space.py
      - name: Fail closed if write credential is absent
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_ORG_TOKEN/HF_TOKEN is absent"; exit 2; }
          echo "::add-mask::$HF_TOKEN"
      - name: Preserve, delete, verify, and receipt exact former Space
        run: python scripts/retire_sentra_space.py
      - name: Upload immutable retirement receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentra-space-retirement-${{ github.run_id }}-${{ github.run_attempt }}
          path: sentra-retirement-receipt.json
          if-no-files-found: error
          retention-days: 180
