name: temporary-platform-contact-sync-348

on:
  push:
    branches:
      - fix/p0-1-dead-security-contact
    paths:
      - .github/workflows/temporary-platform-contact-sync-348.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/p0-1-dead-security-contact
          fetch-depth: 0
          persist-credentials: true
      - name: Regenerate canonical vendor set and stage workflow bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lutar, Stephen P."
          git config user.email "stephenlutar2@gmail.com"

          bash scripts/sync_from_monorepo.sh pin 1f333543c3fb98b4636b9aa9e6f5ffe0e47b47e7
          bash scripts/sync_from_monorepo.sh sync
          bash scripts/sync_from_monorepo.sh check --strict-headers
          python3 -m py_compile szl_connectors/base.py

          mkdir -p .sync-staging
          cp .github/workflows/commit-lint.yml .sync-staging/commit-lint.yml
          cp .github/workflows/pin-check.yml .sync-staging/pin-check.yml
          git checkout HEAD -- \
            .github/workflows/commit-lint.yml \
            .github/workflows/pin-check.yml \
            .github/workflows/temporary-platform-contact-sync-348.yml

          git add -A
          git diff --cached --check
          git commit \
            -m "fix(security): stage canonical platform contact sync" \
            -m "Advance Killinchu to platform 1f333543, regenerate vendored attribution and source bytes, retain the reviewed disclosure fixes, and stage exact workflow blobs for authenticated finalization." \
            -m "Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>"
          git push origin HEAD:fix/p0-1-dead-security-contact
