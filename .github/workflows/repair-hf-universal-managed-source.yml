name: Repair HF universal frontend managed source

on:
  push:
    branches:
      - feat/killinchu-vessels-runtime-current-main

permissions:
  contents: write

concurrency:
  group: repair-hf-universal-managed-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize installer source and manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path.cwd()
          css_path = root / "static" / "szl-universal-frontend.css"
          script_path = root / "scripts" / "apply_hf_universal_frontend_v1.py"
          manifest_path = root / "docs" / "hf-universal-frontend-v1.json"

          css = css_path.read_text(encoding="utf-8")
          if not css.endswith("\n"):
              raise SystemExit("managed CSS must end with a newline")
          required = (
              "--szl-safe-top: env(safe-area-inset-top, 0px);",
              "--szl-safe-right: env(safe-area-inset-right, 0px);",
              "--szl-safe-bottom: env(safe-area-inset-bottom, 0px);",
              "--szl-safe-left: env(safe-area-inset-left, 0px);",
          )
          missing = [needle for needle in required if needle not in css]
          if missing:
              raise SystemExit(f"safe-area CSS is incomplete: {missing}")

          source = script_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'UNIVERSAL_CSS = r""".*?"""\n\n\nclass AdapterError',
              re.DOTALL,
          )
          replacement = 'UNIVERSAL_CSS = r"""' + css + '"""\n\n\nclass AdapterError'
          source, count = pattern.subn(lambda _match: replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"expected one UNIVERSAL_CSS block, replaced {count}")
          script_path.write_text(source, encoding="utf-8")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["file_sha256"]["static/szl-universal-frontend.css"] = hashlib.sha256(
              css.encode("utf-8")
          ).hexdigest()
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(manifest["file_sha256"]["static/szl-universal-frontend.css"])
          PY

      - name: Verify repaired managed source
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check 'pytest==9.0.3'
          python3 -m py_compile scripts/apply_hf_universal_frontend_v1.py
          python3 scripts/apply_hf_universal_frontend_v1.py --check
          python3 -m pytest -q tests/test_hf_universal_frontend_v1.py

      - name: Commit exact repair
        shell: bash
        run: |
          if git diff --quiet -- scripts/apply_hf_universal_frontend_v1.py docs/hf-universal-frontend-v1.json; then
            echo "Managed source already synchronized"
            exit 0
          fi
          git config user.name "Stephen Lutar"
          git config user.email "stephenlutar2@gmail.com"
          git add scripts/apply_hf_universal_frontend_v1.py docs/hf-universal-frontend-v1.json
          git commit -m "fix(frontend): synchronize safe-area managed source" -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin "HEAD:${GITHUB_REF_NAME}"
