name: Asset Exposure Wave 5

on:
  pull_request:
    paths:
      - "szl_connectors/asset_exposure.py"
      - "szl_uds_hardening.py"
      - "tests/test_asset_exposure_wave5.py"
      - "docs/ASSET_EXPOSURE_WAVE5.md"
      - ".github/workflows/asset-exposure-wave5.yml"
  push:
    branches:
      - main
    paths:
      - "szl_connectors/asset_exposure.py"
      - "szl_uds_hardening.py"
      - "tests/test_asset_exposure_wave5.py"
      - "docs/ASSET_EXPOSURE_WAVE5.md"
      - ".github/workflows/asset-exposure-wave5.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-exposure-wave5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Asset inventory + SBOM exposure contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Compile Wave 5 source and integration
        run: |
          python -m py_compile \
            szl_connectors/asset_exposure.py \
            szl_uds_hardening.py \
            tests/test_asset_exposure_wave5.py

      - name: Run network-free Wave 5 contract tests
        run: python -m unittest -v tests.test_asset_exposure_wave5

      - name: Prove runtime registration and Docker inclusion
        run: |
          python - <<'PY'
          from pathlib import Path

          hardening = Path("szl_uds_hardening.py").read_text(encoding="utf-8")
          required = (
              "from szl_connectors import asset_exposure as _asset_exposure",
              "_asset_exposure.register(app, ns)",
              '"asset_exposure": exposure_registration',
          )
          for token in required:
              if token not in hardening:
                  raise SystemExit(f"missing Wave 5 hardening integration: {token}")

          dockerfile = Path("Dockerfile").read_text(encoding="utf-8")
          if "COPY szl_connectors/ ./szl_connectors/" not in dockerfile:
              raise SystemExit("Dockerfile does not include the connector package")
          PY

      - name: Prove no direct target, network, or command primitive
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("szl_connectors/asset_exposure.py").read_text(
              encoding="utf-8"
          )
          forbidden = (
              "import requests",
              "import httpx",
              "import urllib",
              "import socket",
              "import subprocess",
              "os.system(",
              "Popen(",
          )
          present = [token for token in forbidden if token in source]
          if present:
              raise SystemExit(
                  "forbidden Wave 5 primitive(s): " + ", ".join(present)
              )
          PY
