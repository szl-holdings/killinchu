name: Asset Exposure Wave 5

on:
  pull_request:
    paths:
      - "szl_connectors/asset_exposure.py"
      - "szl_uds_hardening.py"
      - "tests/test_asset_exposure_wave5.py"
      - "docs/ASSET_EXPOSURE_WAVE5.md"
      - "scripts/asset_exposure_live_witness.py"
      - ".github/workflows/asset-exposure-live-witness.yml"
      - "Dockerfile"
      - "deploy/space/Dockerfile"
      - "deploy/image-contract.json"
      - ".github/workflows/asset-exposure-wave5.yml"
  push:
    branches:
      - main
    paths:
      - "szl_connectors/asset_exposure.py"
      - "szl_uds_hardening.py"
      - "tests/test_asset_exposure_wave5.py"
      - "docs/ASSET_EXPOSURE_WAVE5.md"
      - "scripts/asset_exposure_live_witness.py"
      - ".github/workflows/asset-exposure-live-witness.yml"
      - "Dockerfile"
      - "deploy/space/Dockerfile"
      - "deploy/image-contract.json"
      - ".github/workflows/asset-exposure-wave5.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-exposure-wave5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Asset inventory + SBOM exposure contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Compile Wave 5 source, integration, and witness
        run: |
          python -m py_compile \
            szl_connectors/asset_exposure.py \
            szl_uds_hardening.py \
            tests/test_asset_exposure_wave5.py \
            scripts/asset_exposure_live_witness.py

      - name: Run network-free Wave 5 contract tests
        run: python -m unittest -v tests.test_asset_exposure_wave5

      - name: Prove runtime registration and exact image inclusion
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          hardening = Path("szl_uds_hardening.py").read_text(encoding="utf-8")
          required = (
              "from szl_connectors import asset_exposure as _asset_exposure",
              "_asset_exposure.register(app, ns)",
              '"asset_exposure": exposure_registration',
          )
          for token in required:
              if token not in hardening:
                  raise SystemExit(f"missing Wave 5 hardening integration: {token}")

          copy_line = (
              "COPY szl_connectors/asset_exposure.py "
              "./szl_connectors/asset_exposure.py"
          )
          canonical = Path("Dockerfile").read_bytes()
          derived = Path("deploy/space/Dockerfile").read_bytes()
          if copy_line.encode() not in canonical:
              raise SystemExit("canonical Dockerfile omits asset_exposure.py")
          if canonical != derived:
              raise SystemExit("derived HF Dockerfile drifted from canonical Dockerfile")

          contract = json.loads(
              Path("deploy/image-contract.json").read_text(encoding="utf-8")
          )
          source = "szl_connectors/asset_exposure.py"
          if source not in contract.get("local_copy_sources", []):
              raise SystemExit("image contract omits asset_exposure.py")
          digest = hashlib.sha256(canonical).hexdigest()
          if contract["canonical_dockerfile"]["sha256"] != digest:
              raise SystemExit("canonical Dockerfile digest is stale")
          if contract["hf_deploy_dockerfile"]["sha256"] != digest:
              raise SystemExit("derived Dockerfile digest is stale")
          PY

      - name: Prove no direct target, network, or command primitive
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("szl_connectors/asset_exposure.py").read_text(
              encoding="utf-8"
          )
          forbidden = (
              "import requests",
              "import httpx",
              "import urllib",
              "import socket",
              "import subprocess",
              "os.system(",
              "Popen(",
          )
          present = [token for token in forbidden if token in source]
          if present:
              raise SystemExit(
                  "forbidden Wave 5 primitive(s): " + ", ".join(present)
              )
          PY

      - name: Prove production witness is fixed-origin and synthetic
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("scripts/asset_exposure_live_witness.py").read_text(
              encoding="utf-8"
          )
          required = (
              'BASE = "https://szlholdings-killinchu.hf.space"',
              'WITNESS_ASSET = "witness:synthetic:wave5"',
              'WITNESS_CVE = "CVE-2021-44228"',
              '(EXPOSURE_URL, "POST")',
              '"asset_scanning_performed"',
              '"component_vulnerability_inference_performed"',
          )
          for token in required:
              if token not in source:
                  raise SystemExit(f"live witness contract drifted: {token}")
          for token in ('--base', 'os.environ.get("BASE")', "os.environ['BASE']"):
              if token in source:
                  raise SystemExit(f"live witness gained a variable target: {token}")
          PY
