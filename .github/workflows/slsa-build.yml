#
# SLSA source-release provenance — consolidated path (2026-07-15).
#
# History (honest): this workflow previously called the reusable
# slsa-framework/slsa-github-generator generator_generic_slsa3.yml (SHA-pinned
# at the caller). The generator internally invokes its own composite actions by
# TAG (e.g. .../detect-workflow-js@v2.1.0), which the org actions policy
# ("all actions must be pinned to a full-length commit SHA") rejects at job
# setup — see run 29387794215. Rather than relax the pin policy for an external
# publisher, source provenance is consolidated onto
# actions/attest-build-provenance — the same signed in-toto slsa.dev/provenance
# mechanism (Sigstore keyless: Fulcio certificate + Rekor transparency log,
# GitHub Attestations API) that already backs the container claim in
# ghcr-build-push.yml. No level claimed here beyond what
# .compliance/SLSA_LEVEL.md states.
#
# Verify a released tarball downstream:
#   gh attestation verify killinchu-<ref>.tar.gz --owner szl-holdings

name: SLSA Build Provenance (signed, source release)

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch: {}

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attest:
    name: pack + attest source provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # attach artifact to a published release
      id-token: write      # Sigstore keyless (Fulcio OIDC)
      attestations: write  # GitHub Attestations API
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pack source release artifact
        id: pack
        run: |
          set -euo pipefail
          NAME="${GITHUB_REPOSITORY##*/}-${GITHUB_REF_NAME//\//-}.tar.gz"
          git archive --format=tar.gz -o "${NAME}" HEAD
          echo "artifact=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "sha256=$(sha256sum "${NAME}" | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance (signed in-toto, Fulcio + Rekor)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.artifact }}

      - name: Upload run artifact (evidence)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-release-artifact
          path: ${{ steps.pack.outputs.artifact }}
          if-no-files-found: error

      - name: Attach artifact to published release (release events only)
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" "${{ steps.pack.outputs.artifact }}" --clobber
