name: Apply Killinchu Intel Archive License Patch — Controlled

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-intel-archive-license-patch.yml
      - scripts/apply_intel_archive_license_patch.py
      - killinchu_intel_archive_card.py
      - datasets/killinchu-osint-corpus/**
      - tests/test_killinchu_intel_archive_card.py

permissions:
  contents: write

concurrency:
  group: apply-intel-archive-license-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Deterministically wire canonical card source
    if: >-
      github.repository == 'szl-holdings/killinchu' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/intel-archive-license-contract-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Apply bounded source replacements
        id: apply
        shell: bash
        run: |
          set +e
          {
            set -x
            python -m py_compile \
              scripts/apply_intel_archive_license_patch.py \
              killinchu_intel_archive_card.py \
              tests/test_killinchu_intel_archive_card.py
            python scripts/apply_intel_archive_license_patch.py
            python -m pip install --disable-pip-version-check pytest
            python -m pytest -q tests/test_killinchu_intel_archive_card.py
            git diff --check
          } 2>&1 | tee patch-execution.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload bounded patch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: killinchu-intel-archive-patch-${{ github.run_id }}
          path: patch-execution.log
          if-no-files-found: error
          retention-days: 30

      - name: Enforce patch and commit source wiring
        env:
          APPLY_EXIT: ${{ steps.apply.outputs.exit_code }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "${APPLY_EXIT:-2}" != '0' ]; then
            echo "::error::Bounded source patch or regression test failed."
            exit "${APPLY_EXIT:-2}"
          fi
          if git diff --quiet -- killinchu_osint.py Dockerfile; then
            echo 'Source wiring is already exact.'
            exit 0
          fi
          git config user.name 'killinchu-license-controller[bot]'
          git config user.email 'killinchu-license-controller@users.noreply.github.com'
          git add killinchu_osint.py Dockerfile
          git commit -s -m 'fix(dataset): wire canonical archive card source'
          git push origin "HEAD:${HEAD_BRANCH}"
