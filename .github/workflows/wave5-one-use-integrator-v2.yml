name: Wave 5 one-use integrator v2

on:
  push:
    branches:
      - "feat/asset-sbom-exposure-wave5-20260904"
    paths:
      - ".github/workflows/wave5-one-use-integrator-v2.yml"

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Wave 5 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "feat/asset-sbom-exposure-wave5-20260904"
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Apply exact Wave 5 integration
        run: |
          set -euo pipefail
          python scripts/wave5_integrator.py
          rm -f \
            scripts/wave5_integrator.py \
            .github/workflows/wave5-one-use-integrator.yml \
            .github/workflows/wave5-one-use-integrator-v2.yml

      - name: Verify integrated source and image contract
        run: |
          set -euo pipefail
          python -m py_compile \
            szl_connectors/asset_exposure.py \
            szl_uds_hardening.py \
            tests/test_asset_exposure_wave5.py
          python -m unittest -v tests.test_asset_exposure_wave5
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          hardening = Path("szl_uds_hardening.py").read_text(encoding="utf-8")
          for token in (
              "from szl_connectors import asset_exposure as _asset_exposure",
              "_asset_exposure.register(app, ns)",
              '"asset_exposure": exposure_registration',
          ):
              if token not in hardening:
                  raise SystemExit(f"missing runtime integration: {token}")

          copy_line = (
              "COPY szl_connectors/asset_exposure.py "
              "./szl_connectors/asset_exposure.py"
          ).encode()
          canonical = Path("Dockerfile").read_bytes()
          derived = Path("deploy/space/Dockerfile").read_bytes()
          if copy_line not in canonical:
              raise SystemExit("canonical image omits Wave 5 source")
          if canonical != derived:
              raise SystemExit("derived HF Dockerfile drifted from canonical")

          contract = json.loads(
              Path("deploy/image-contract.json").read_text(encoding="utf-8")
          )
          if "szl_connectors/asset_exposure.py" not in contract["local_copy_sources"]:
              raise SystemExit("image contract omits Wave 5 source")
          digest = hashlib.sha256(canonical).hexdigest()
          if contract["canonical_dockerfile"]["sha256"] != digest:
              raise SystemExit("canonical image-contract digest mismatch")
          if contract["hf_deploy_dockerfile"]["sha256"] != digest:
              raise SystemExit("derived image-contract digest mismatch")
          PY
          git diff --check

      - name: Commit the converged Wave 5 branch
        run: |
          set -euo pipefail
          git config user.name "Stephen Lutar"
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git commit -s -m "feat(defend): integrate asset SBOM exposure wave 5"
          git push origin HEAD:"feat/asset-sbom-exposure-wave5-20260904"
