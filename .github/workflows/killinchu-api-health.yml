# killinchu-api-health.yml — standing health check for killinchu's LIVE API.
# Doctrine v11 LOCKED 749/14/163 | SLSA L1 honest
# Signed-off-by: Yachay <yachay@szlholdings.ai>
#
# Complements (does NOT replace) smoke-monitor.yml: that one only asserts HTTP
# 200 on the HF Space front-doors. This one asserts the deployed /api/killinchu/*
# endpoints keep returning JSON (content-type application/json) carrying the
# Doctrine v11 envelope {status, citations, fetchedAt} — i.e. it catches the
# regression where the SPA HTML is served with a 200 instead of the real API
# payload. Tolerant of transient rebuild states (bounded retries), and alerts the
# team via the shared ntfy channel on a sustained failure.
#
# TWO TARGETS, ONE GATE. The published surface (HF Space) is the blocking gate.
# The own-metal box is probed too, but as a separate NON-BLOCKING job, because
# the two have different owners and different failure modes:
#
#   - HF Space down  => the published product is broken. Page someone. BLOCKING.
#   - box down       => an internal host is offline. Real, worth surfacing, but
#                       it does not mean the product is down.
#
# Before this split, a box outage held the whole check red indefinitely while
# all five endpoints passed on the published surface. A gate that is red for a
# reason nobody is acting on stops being a gate — people learn to ignore it, and
# then a genuine published-surface regression hides in the same red. The box
# signal is preserved and made sharper: diagnose_own_metal_reachability.py
# distinguishes "no DNS record" (Cloudflare change) from Cloudflare 530/1033
# "tunnel has no connector" (start cloudflared on the box) from an application
# 5xx, and names the owner for each.
#
# Org policy compliance: github-owned actions only, SHA-pinned; checker is
# stdlib-only Python (no pip install, no third-party action); alert posts a
# Slack-compatible payload via raw curl to the shared webhook (soft-skips if the
# secret is unset — the red run still stands as the signal).

name: Killinchu API Health

on:
  schedule:
    - cron: '20 */6 * * *'   # every 6h, offset from smoke-monitor (0 */6)
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'manual check'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  self-test:
    name: Validator self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run validator self-test (proves it catches SPA-HTML / missing-field)
        run: python3 scripts/test_check_killinchu_api_health.py

      - name: Run own-metal classifier self-test (proves it names the right owner)
        run: python3 scripts/test_diagnose_own_metal_reachability.py

  health:
    name: Live API health (published surface)
    needs: self-test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Probe live killinchu API on both targets
        id: probe
        run: |
          set +e
          python3 scripts/check_killinchu_api_health.py \
            --target "hf=https://szlholdings-killinchu.hf.space" \
            --summary-file /tmp/killinchu-api-health.json | tee /tmp/probe.log
          # Capture the validator, not tee. Without PIPESTATUS this step can
          # report a green run while every live probe is sustained-down.
          code="${PIPESTATUS[0]}"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ -f /tmp/killinchu-api-health.json ]; then
            checked=$(python3 -c "import json;print(json.load(open('/tmp/killinchu-api-health.json'))['checked'])")
            passed=$(python3 -c "import json;print(json.load(open('/tmp/killinchu-api-health.json'))['passed'])")
            failed=$(python3 -c "import json;print(json.load(open('/tmp/killinchu-api-health.json'))['failed'])")
            echo "checked=$checked" >> "$GITHUB_OUTPUT"
            echo "passed=$passed" >> "$GITHUB_OUTPUT"
            echo "failed=$failed" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Killinchu live API health (published surface)"
            echo ""
            echo '```'
            cat /tmp/probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Do NOT fail here — the final gate fails the run, so the alert step
          # (which is gated on this exit_code) always gets a chance to run first.
          exit 0

      - name: Alert the team on sustained API failure
        if: ${{ always() && steps.probe.outputs.exit_code != '0' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          CHECKED: ${{ steps.probe.outputs.checked }}
          PASSED: ${{ steps.probe.outputs.passed }}
          FAILED: ${{ steps.probe.outputs.failed }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL secret not configured — skipping direct alert. The failed run still stands as the signal."
            exit 0
          fi

          fails="$(python3 -c "import json;d=json.load(open('/tmp/killinchu-api-health.json'));print(chr(10).join('- %s %s: %s' % (f['target'], f['path'], f['reason']) for f in d['failures']))" 2>/dev/null || echo '(per-check breakdown unavailable)')"

          # Compose with real newlines, then JSON-encode safely with jq
          # (preinstalled on ubuntu-latest). The shared webhook is the team ntfy
          # channel (via the szl-alert-relay); it renders the `text` field.
          text=":rotating_light: *Killinchu PUBLISHED API health FAILED* — one or more /api/killinchu/* endpoints on the published Hugging Face Space stopped returning a valid Doctrine v11 JSON envelope in ${REPO}. (Own-metal box reachability is tracked separately and does not trigger this alert.)
          *Counts:* checked=${CHECKED:-?} passed=${PASSED:-?} failed=${FAILED:-?}
          *Failing checks:*
          ${fails}
          *Run:* ${RUN_URL}"

          payload=$(jq -n --arg text "$text" '{text: $text}')
          echo "Posting killinchu-api-health alert to the shared webhook..."
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
                   -X POST -H 'Content-Type: application/json' \
                   --max-time 20 --data "${payload}" "${SLACK_WEBHOOK_URL}")
          echo "Webhook responded HTTP ${code}."
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::Alert webhook POST failed (HTTP ${code}): $(cat /tmp/resp.txt)"
            exit 1
          fi
          echo "Direct alert delivered."

      - name: Fail the run on sustained API failure
        if: always()
        run: |
          code="${{ steps.probe.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "::error::Killinchu published API health check failed — see the run summary for the per-check breakdown."
            exit 1
          fi
          echo "Killinchu published API healthy on all endpoints."

  own-metal-reachability:
    name: Own-metal box reachability (informational)
    needs: self-test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Non-blocking on purpose. The box is an internal host; its being offline is
    # a real signal but it is not a published-product regression, so it must not
    # hold the gate red. See the header note.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Classify own-metal reachability and name the owner
        id: diagnose
        run: |
          set +e
          python3 scripts/diagnose_own_metal_reachability.py \
            --url "https://killinchu.a-11-oy.com" \
            --summary-file /tmp/own-metal.json | tee /tmp/own-metal.log
          diagnosis="$(python3 -c "import json;print(json.load(open('/tmp/own-metal.json'))['diagnosis'])" 2>/dev/null || echo UNKNOWN)"
          owner="$(python3 -c "import json;print(json.load(open('/tmp/own-metal.json'))['owner'])" 2>/dev/null || echo 'needs manual triage')"
          echo "diagnosis=$diagnosis" >> "$GITHUB_OUTPUT"
          {
            echo "### Own-metal box reachability (informational)"
            echo ""
            echo "**Diagnosis:** \`$diagnosis\`"
            echo ""
            echo "**Owner:** $owner"
            echo ""
            echo '```'
            cat /tmp/own-metal.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Annotate when the box is not reachable
        if: ${{ always() && steps.diagnose.outputs.diagnosis != 'REACHABLE' }}
        run: |
          echo "::warning::Own-metal box not reachable (${{ steps.diagnose.outputs.diagnosis }}). This does NOT fail the run — the published surface is gated separately."
