name: One-shot Killinchu shared-source convergence

on:
  push:
    branches:
      - fix/shared-source-convergence-a11oy-1604-20260831

permissions:
  contents: write

concurrency:
  group: killinchu-shared-source-convergence-20260831
  cancel-in-progress: false

jobs:
  converge:
    if: >-
      github.repository == 'szl-holdings/killinchu' &&
      github.ref == 'refs/heads/fix/shared-source-convergence-a11oy-1604-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_BASE_SHA: 0b86cb148248171b73d6b51c12b74cf53b328407
      A11OY_SOURCE_SHA: 6eb82824612de8d1ade0f02437701c5440bf6336
    steps:
      - name: Checkout exact Killinchu branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: self
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout exact A11oy coordinated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/a11oy
          ref: ${{ env.A11OY_SOURCE_SHA }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source and destination identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C self rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/fix/shared-source-convergence-a11oy-1604-20260831"
          test "$(git -C source rev-parse HEAD)" = "$A11OY_SOURCE_SHA"
          test "$(git -C self ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_BASE_SHA"
          test "$(git -C self ls-remote origin "$GITHUB_REF" | awk '{print $1}')" = "$GITHUB_SHA"

      - name: Copy only the five blocking shared files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            static/vendor3d/OrbitControls.js
            static/vendor3d/THREE_LICENSE.txt
            szl_chain_of_title.py
            szl_khipu_lmdb.py
            szl_unified_formulas.py
          )
          for rel in "${files[@]}"; do
            test -f "source/$rel"
            test ! -L "source/$rel"
            test -f "self/$rel"
            test ! -L "self/$rel"
            install -D -m 0644 "source/$rel" "self/$rel"
          done

      - name: Verify complete shared-source contract against the exact peer
        shell: bash
        run: |
          set -euo pipefail
          python3 self/.github/shared-file-drift-check.py self source \
            --self-name=killinchu --sibling-name=a11oy

      - name: Prove bounded delta and commit
        working-directory: self
        shell: bash
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          actual="$(mktemp)"
          printf '%s\n' \
            static/vendor3d/OrbitControls.js \
            static/vendor3d/THREE_LICENSE.txt \
            szl_chain_of_title.py \
            szl_khipu_lmdb.py \
            szl_unified_formulas.py \
            | sort > "$expected"
          git diff --name-only | sort > "$actual"
          diff -u "$expected" "$actual"
          git add -- \
            static/vendor3d/OrbitControls.js \
            static/vendor3d/THREE_LICENSE.txt \
            szl_chain_of_title.py \
            szl_khipu_lmdb.py \
            szl_unified_formulas.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(shared): converge five Platform-sourced peer files' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push origin "HEAD:fix/shared-source-convergence-a11oy-1604-20260831"
