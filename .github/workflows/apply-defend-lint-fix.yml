name: Apply Defend lint fix

on:
  push:
    branches:
      - feat/defend-plane-final-20260904
    paths:
      - .github/workflows/apply-defend-lint-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact Defend branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/defend-plane-final-20260904
          fetch-depth: 1

      - name: Remove only the two proven unused imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("killinchu_defend_plane.py")
          text = source.read_text(encoding="utf-8")
          for line in ("import html\n", "import time\n"):
              if text.count(line) != 1:
                  raise SystemExit(f"precondition failed for {line!r}: {text.count(line)}")
              text = text.replace(line, "", 1)
          source.write_text(text, encoding="utf-8", newline="\n")
          Path(".github/workflows/apply-defend-lint-fix.yml").unlink()
          PY

      - name: Prove syntax and blocking Ruff contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "ruff==0.16.6"
          python -m py_compile killinchu_defend_plane.py
          ruff check killinchu_defend_plane.py --select E9,F
          git diff --check

      - name: Commit deterministic repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "szl-defend-operator[bot]"
          git config user.email "szl-defend-operator[bot]@users.noreply.github.com"
          git add killinchu_defend_plane.py .github/workflows/apply-defend-lint-fix.yml
          git diff --cached --check
          git commit -m "fix(defend): remove proven unused imports" -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:feat/defend-plane-final-20260904
