name: Watchlist alert integration

# Guards the watchlist ALERTING path end to end (Task #1000): booting the whole
# killinchu FastAPI app, a real-shaped ADS-B scrape that matches a watchlist
# trigger must record exactly one in-app alert and attempt exactly one ntfy push;
# a standing/identical match must NOT re-page (edge-dedup), a fresh clear->fire
# edge must page again, and with a cooldown configured a still-firing condition
# re-pages only after the quiet window. Drives the real run_crawl /
# _evaluate_watchlists / edge-dedup state machine through the HTTP surface against
# a temp SQLite DB with a monkeypatched upstream fetch + raw ntfy sender (no
# network).

on:
  push:
    branches: [main]
    paths:
      - killinchu_backend.py
      - tests/test_watchlist_alert_integration.py
      - .github/workflows/watchlist-alert-integration.yml
  pull_request:
    branches: [main]
    paths:
      - killinchu_backend.py
      - tests/test_watchlist_alert_integration.py
      - .github/workflows/watchlist-alert-integration.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watchlist-alert-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install test deps
        run: python -m pip install --disable-pip-version-check pytest fastapi httpx
      - name: Run watchlist alert integration test
        run: python -m pytest tests/test_watchlist_alert_integration.py -q
