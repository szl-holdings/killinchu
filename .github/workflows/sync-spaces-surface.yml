name: Sync exact shared Spaces surface

on:
  push:
    branches: [agent/sync-spaces-surface-20260722]
    paths:
      - .github/workflows/sync-spaces-surface.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/sync-spaces-surface-20260722
          fetch-depth: 0
      - name: Fetch immutable a11oy shared source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github.raw+json' \
            'repos/szl-holdings/a11oy/contents/szl_spaces_surface.py?ref=bca063259721945835501e0fa7cf1d9425a6dfdc' \
            > /tmp/szl_spaces_surface.py
          actual="$(git hash-object /tmp/szl_spaces_surface.py)"
          expected='8103f030d70b19f4ba2f053632df5c21fa5b08f7'
          if [ "$actual" != "$expected" ]; then
            echo "::error::immutable source blob mismatch: expected=$expected actual=$actual"
            exit 1
          fi
          mv /tmp/szl_spaces_surface.py szl_spaces_surface.py
      - name: Verify shared module contracts
        run: |
          set -euo pipefail
          python -m py_compile szl_spaces_surface.py
          python -m pytest -q tests/test_ecosystem_alignment.py
      - name: Commit exact sync and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/sync-spaces-surface.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add szl_spaces_surface.py .github/workflows/sync-spaces-surface.yml
          git commit \
            -m 'fix(spaces): sync exact SDA contract surface' \
            -m 'Copy szl_spaces_surface.py byte-for-byte from the reviewed A11oy SDA contract head so the cross-repository drift ratchet remains enforced.' \
            -m 'Source blob: 8103f030d70b19f4ba2f053632df5c21fa5b08f7' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push origin HEAD:agent/sync-spaces-surface-20260722
