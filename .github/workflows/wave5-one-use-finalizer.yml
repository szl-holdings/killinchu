name: Wave 5 one-use numerical finalizer

on:
  push:
    branches:
      - "feat/asset-sbom-exposure-wave5-20260904"
    paths:
      - ".github/workflows/wave5-one-use-finalizer.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Wave 5 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "feat/asset-sbom-exposure-wave5-20260904"
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Apply final numerical and disclosure guards
        run: |
          set -euo pipefail
          python scripts/wave5_finalizer.py
          rm -f \
            scripts/wave5_finalizer.py \
            .github/workflows/wave5-one-use-finalizer.yml

      - name: Requalify the complete Wave 5 branch
        run: |
          set -euo pipefail
          python -m py_compile \
            szl_connectors/asset_exposure.py \
            szl_uds_hardening.py \
            tests/test_asset_exposure_wave5.py \
            scripts/asset_exposure_live_witness.py
          python -m unittest -v tests.test_asset_exposure_wave5
          python - <<'PY'
          from pathlib import Path

          source = Path("szl_connectors/asset_exposure.py").read_text(
              encoding="utf-8"
          )
          required = (
              "allow_nan=False",
              "math.isfinite(number)",
              "_SOURCE_PRIORITIES",
              "resolver returned an invalid priority record",
          )
          for token in required:
              if token not in source:
                  raise SystemExit(f"missing final numerical guard: {token}")

          disclosure = Path("szl_uds_hardening.py").read_text(encoding="utf-8")
          disclosure_tokens = (
              "SBOM/CVE associations are",
              "operator supplied",
              "official-source gaps remain explicit",
          )
          for token in disclosure_tokens:
              if token not in disclosure:
                  raise SystemExit(f"hardening disclosure missing: {token}")
          PY
          git diff --check

      - name: Commit the finalized Wave 5 branch
        run: |
          set -euo pipefail
          git config user.name "Stephen Lutar"
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git commit -s -m "fix(defend): reject non-finite Wave 5 priority evidence"
          git push origin HEAD:"feat/asset-sbom-exposure-wave5-20260904"
