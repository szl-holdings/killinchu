name: Regenerate HF frontend manifest

on:
  push:
    branches:
      - docs/decision-layer-live-clean-20260829

permissions:
  contents: write

concurrency:
  group: regenerate-hf-frontend-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact successor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Regenerate and verify managed frontend identity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply_hf_universal_frontend_v1.py
          python3 scripts/apply_hf_universal_frontend_v1.py
          python3 scripts/apply_hf_universal_frontend_v1.py --check
          git diff --check

      - name: Commit exact manifest and remove this bounded workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-regenerate-hf-frontend-manifest.yml
          git add README.md docs/hf-universal-frontend-v1.json
          git diff --cached --check
          git config user.name 'Lutar, Stephen P.'
          git config user.email 'stephenlutar2@gmail.com'
          git commit \
            -m 'fix(hf): bind decision-layer copy to frontend manifest' \
            -m 'Regenerate the managed Hugging Face frontend manifest from the exact reviewed README bytes and remove this bounded branch-local workflow.' \
            -m 'Signed-off-by: Lutar, Stephen P. <stephenlutar2@gmail.com>'
          git push origin "HEAD:${GITHUB_REF_NAME}"
