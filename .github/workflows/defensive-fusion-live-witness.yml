# SPDX-License-Identifier: Apache-2.0
name: Defensive Fusion Live Witness

on:
  workflow_run:
    workflows:
      - Sync to HuggingFace Space
    types:
      - completed
  push:
    branches: [main]
    paths:
      - szl_connectors/data_sources/security.py
      - szl_connectors/bindings.py
      - scripts/defensive_fusion_live_witness.py
      - tests/test_defensive_fusion_wave4.py
      - .github/workflows/defensive-fusion-live-witness.yml
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: killinchu-defensive-fusion-live-witness
  cancel-in-progress: true

jobs:
  witness:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Check out protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Verify exact deployed source and defensive-only contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/defensive_fusion_live_witness.py
          --output defensive-fusion-live-witness.json
          --retry-seconds 600
      - name: Upload immutable witness
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: defensive-fusion-live-witness-${{ github.run_id }}-${{ github.run_attempt }}
          path: defensive-fusion-live-witness.json
          if-no-files-found: error
          retention-days: 90
