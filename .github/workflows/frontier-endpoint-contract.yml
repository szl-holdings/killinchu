name: Frontier-endpoint governance contract

# SAFETY NET (Wave J, Dev 3): every /api/killinchu/v1/* frontier endpoint that the
# surface .js files actually fetch (harness, vqc, eval, attest, interpretability,
# cc-attest, sement, ttc, specdec, worldmodel, episodic, qec, energy, trackfusion,
# edgefusion, agentmem, onebit, …) was TestClient-smoked ONCE, not covered. This
# gate boots the REAL app in-process (no mocks, no network) and drives EVERY
# frontier endpoint from the committed manifest (tests/frontier_endpoints.json,
# generated by scanning the surface .js fetch URLs against the assembled route
# table), asserting the governance invariants: good input never 500s / never
# bare-422s (200 or an honest labelled 503); honest disclosure label present
# (strict on the core organs) and in-vocabulary; Λ (Conjecture 1) never "green"
# and any advisory Λ <= 0.97; receipt shape valid where a receipt is emitted;
# and unknown-id / malformed input degrades to an honest 4xx, never a 500. A
# future edit that regresses a frontier endpoint into the 422 / silent-degrade
# class becomes a red gate here instead of a silent live failure.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontier-endpoint-contract:
    name: Frontier-endpoint governance contract (pytest — Wave J Dev 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # github-owned actions only. actions/setup-python is github-owned.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install test deps (serve.py boots in-process via Starlette TestClient)
        run: |
          python -m pip install --upgrade pip
          # serve.py imports fastapi/starlette; httpx backs Starlette TestClient.
          pip install fastapi starlette httpx pytest
      - name: Frontier-endpoint contract — the 422 / silent-degrade safety net
        run: python -m pytest tests/test_frontier_endpoints.py -q
