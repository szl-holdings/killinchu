name: DCO

on:
  pull_request:
    branches: [main]

# Solo-builder policy: commit signatures and Signed-off-by trailers are optional
# metadata. Keep the historical required-check context green without weakening
# code, security, secret-scanning, dependency, build, or test validation.
permissions:
  contents: read

jobs:
  dco:
    name: dco / DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record solo-builder attribution policy
        shell: bash
        run: |
          set -euo pipefail
          echo "Solo-builder policy active: commit signatures and DCO trailers are optional."
          echo "Code, security, build, and test validation remain authoritative."
