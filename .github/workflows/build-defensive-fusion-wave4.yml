# SPDX-License-Identifier: Apache-2.0
name: Build Defensive Fusion Wave 4

on:
  push:
    branches:
      - feat/defensive-fusion-wave4-20260904
    paths:
      - .github/workflows/build-defensive-fusion-wave4.yml
      - scripts/build_defensive_fusion_wave4.py
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-defensive-fusion-wave4
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out wave branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/defensive-fusion-wave4-20260904
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Generate source-bound defensive fusion
        run: python scripts/build_defensive_fusion_wave4.py

      - name: Run focused deterministic gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir pytest
          python -m py_compile \
            szl_connectors/data_sources/security.py \
            szl_connectors/bindings.py \
            scripts/defensive_fusion_live_witness.py \
            tests/test_defensive_fusion_wave4.py
          python -m pytest -q tests/test_defensive_fusion_wave4.py
          git diff --check
          test ! -e .github/workflows/build-defensive-fusion-wave4.yml
          test ! -e scripts/build_defensive_fusion_wave4.py

      - name: Push source payload; workflow replacement is owner-controlled
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's workflow token intentionally lacks the separate workflows
          # scope. Restore the current builder and omit the generated witness
          # workflow from this push; the owner-authorized GitHub API installs
          # that workflow after the tested source commit exists.
          git checkout HEAD -- .github/workflows/build-defensive-fusion-wave4.yml
          rm -f .github/workflows/defensive-fusion-live-witness.yml
          test -e .github/workflows/build-defensive-fusion-wave4.yml
          test ! -e .github/workflows/defensive-fusion-live-witness.yml
          test ! -e scripts/build_defensive_fusion_wave4.py

          git config user.name "Stephen Lutar"
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git commit -m "feat(defend): add exact-CVE defensive fusion wave 4" \
            -m "Correlate CISA KEV, NIST NVD, and FIRST EPSS into one deterministic, fail-closed defensive-prioritization connector with no scanner, exploit content, arbitrary target, or execution authority. Add focused tests, documentation, product binding, and exact-source witness code." \
            -m "Signed-off-by: Stephen Lutar <stephenlutar2@gmail.com>"
          git push origin HEAD:feat/defensive-fusion-wave4-20260904
