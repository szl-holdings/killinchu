name: SZL Public Experience v3 Contract

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: public-experience-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-experience-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit
      - name: Checkout candidate integration result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install exact focused test runtime
        run: python -m pip install --disable-pip-version-check 'pytest==9.0.3'
      - name: Verify host, pure presentation, and generated source ownership
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -m py_compile scripts/apply_hf_universal_frontend_v1.py scripts/verify_public_experience_host.py
          python scripts/apply_hf_universal_frontend_v1.py --check
          mkdir -p artifacts
          python scripts/verify_public_experience_host.py | tee artifacts/public-experience-host.json
          python -m pytest -q tests/test_hf_universal_frontend_v1.py tests/test_public_experience_host.py
          git diff --check
          git diff --exit-code -- README.md static/index.html static/truth-cop.js static/szl-universal-frontend.css docs/hf-universal-frontend-v1.json design/szl-public-experience-v3.css
      - name: Retain source contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-experience-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/public-experience-host.json
          if-no-files-found: warn
          retention-days: 30
