# SPDX-License-Identifier: Apache-2.0
name: Materialize Killinchu Public Source Fabric v1

# One-use same-repository bootstrap. It installs only a fixed, reviewed,
# official-public-source connector and then deletes itself from the candidate.
# No secrets are requested and no third-party system is probed or mutated.
on:
  push:
    branches:
      - feat/public-source-fabric-v1-20260904

permissions:
  contents: write

concurrency:
  group: materialize-public-source-fabric-v1
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'szl-holdings/killinchu' &&
      github.actor == 'stephenlutar2-hash'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out the exact candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install exact focused-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          "pytest==8.4.2" "fastapi==0.137.2" "starlette==1.3.1"

      - name: Verify and extract the reviewed source-contained bundle
        run: |
          set -euo pipefail
          mkdir -p /tmp/killinchu-public-source
          cat .bootstrap/archive.part-*.b64 \
            | tr -d '[:space:]' \
            | base64 --decode \
            > /tmp/killinchu-public-source-fabric-v1.tar.gz
          echo "12c4a52acce676bb2b13497dfa9ae124e376f5ede61eefa33e3429a0b5cb5cca  /tmp/killinchu-public-source-fabric-v1.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip \
            --file /tmp/killinchu-public-source-fabric-v1.tar.gz \
            --directory /tmp/killinchu-public-source \
            --no-same-owner --no-same-permissions
          test -f /tmp/killinchu-public-source/killinchu_public_osint_frontier/apply_killinchu_public_osint_frontier.py

      - name: Materialize, regenerate, and test the public-source fabric
        run: >-
          python
          /tmp/killinchu-public-source/killinchu_public_osint_frontier/apply_killinchu_public_osint_frontier.py
          --repo .
          --bundle /tmp/killinchu-public-source/killinchu_public_osint_frontier

      - name: Remove one-use bootstrap files
        run: |
          rm -f .github/workflows/materialize-public-source-fabric-pr.yml
          rm -f .bootstrap/archive.part-*.b64
          rmdir .bootstrap 2>/dev/null || true

      - name: Verify final candidate and publish it to the branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/image_contract.py --check
          python -m pytest -q \
            tests/test_public_source_fabric.py \
            tests/test_public_source_repo_integration.py \
            test_killinchu_vessels_screening.py
          git diff --check
          test -z "$(find .bootstrap -type f -print 2>/dev/null || true)"
          test -n "$(git status --porcelain)"
          git config user.name "Stephen Lutar"
          git config user.email "stephenlutar2@gmail.com"
          git add -A
          git commit -s -m "feat(osint): wire the bounded official public-source fabric"
          git push origin "HEAD:${TARGET_BRANCH}"
