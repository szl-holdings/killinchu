name: Apply resilience route convergence patch

on:
  push:
    branches:
      - feat/resilience-route-convergence-20260904
    paths:
      - .github/workflows/apply-resilience-route-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/resilience-route-convergence-20260904
          fetch-depth: 1

      - name: Apply exact route-map transformation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("killinchu_nav_wireup.py")
          text = path.read_text(encoding="utf-8")
          old = '''_BARE_SURFACE_REDIRECTS = {
              "/organism": "/elite/organism",
              "/active-flux": "/elite/active-flux",
              "/platform-dynamics": "/elite/platform-dynamics",
          }
          '''
          new = '''_BARE_SURFACE_REDIRECTS = {
              "/organism": "/elite/organism",
              "/active-flux": "/elite/active-flux",
              "/platform-dynamics": "/elite/platform-dynamics",
              # Cyber-resilience product convergence: Vessels and Aegis are no
              # longer separate public products. These same-origin aliases land
              # on Killinchu's existing source-native operator surfaces.
              "/resilience": "/elite",
              "/vessels": "/elite/maritime",
              "/maritime": "/elite/maritime",
              "/airspace": "/elite#cuas_lab",
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("route-map precondition failed: expected exact block once")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8", newline="\n")

          workflow = Path(".github/workflows/apply-resilience-route-patch.yml")
          workflow.unlink()
          PY

      - name: Prove aliases and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile killinchu_nav_wireup.py
          python - <<'PY'
          import runpy
          module = runpy.run_path("killinchu_nav_wireup.py")
          observed = module["_BARE_SURFACE_REDIRECTS"]
          expected = {
              "/resilience": "/elite",
              "/vessels": "/elite/maritime",
              "/maritime": "/elite/maritime",
              "/airspace": "/elite#cuas_lab",
          }
          for source, target in expected.items():
              assert observed.get(source) == target, (source, observed.get(source))
          assert "/defend" not in observed
          assert "/immune" not in observed
          print("Killinchu resilience aliases: PASS")
          PY

      - name: Commit deterministic transformation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "szl-convergence-operator[bot]"
          git config user.email "szl-convergence-operator[bot]@users.noreply.github.com"
          git add killinchu_nav_wireup.py .github/workflows/apply-resilience-route-patch.yml
          git diff --cached --check
          git commit -m "feat(routes): converge Vessels and Aegis into Killinchu"
          git push origin HEAD:feat/resilience-route-convergence-20260904
