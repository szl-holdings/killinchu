name: temporary-protected-merge-controller

on:
  push:
    branches:
      - ops/protected-merge-controller-20260830
    paths:
      - .github/workflows/temporary-protected-merge-controller.yml

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/protected-merge-controller-20260830
          fetch-depth: 1
          persist-credentials: true
      - name: Converge protected PR queue without bypassing gates
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          declare -A rerun_seen=()
          for cycle in $(seq 1 80); do
            runs="$(gh run list --repo "$repo" --limit 80 --json databaseId,status,conclusion,name,headBranch 2>/dev/null || echo '[]')"
            while IFS=$'\t' read -r id name branch; do
              [ -n "$id" ] || continue
              if [ -z "${rerun_seen[$id]:-}" ]; then
                gh run rerun "$id" --repo "$repo" --failed 2>/dev/null \
                  || gh run rerun "$id" --repo "$repo" 2>/dev/null \
                  || true
                rerun_seen[$id]=1
              fi
            done < <(jq -r '.[] | select(.status == "completed") | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | select(.name | startswith("temporary-")) | [.databaseId, .name, .headBranch] | @tsv' <<<"$runs")

            open_json="$(gh api "repos/$repo/pulls?state=open&per_page=100" 2>/dev/null || echo '[]')"
            while IFS=$'\t' read -r number branch; do
              [ -n "$number" ] || continue
              gh pr merge "$number" --repo "$repo" --auto --squash 2>/dev/null || true
            done < <(jq -r '.[] | select(.draft == false) | select(.head.repo.full_name == .base.repo.full_name) | select(([((.labels // [])[] | .name | ascii_downcase)] | any(. == "do-not-merge" or . == "hold" or . == "blocked" or . == "security-review")) | not) | [.number, .head.ref] | @tsv' <<<"$open_json")
            sleep 30
          done
      - name: Delete temporary controller branch
        if: always()
        shell: bash
        run: |
          set +e
          git push origin --delete "$GITHUB_REF_NAME"
          exit 0
