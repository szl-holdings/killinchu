name: Sync to HuggingFace Space

# Thin caller for the immutable reusable deployer. It derives the exact Space
# file set from Dockerfile COPY sources, binds SZL_GIT_SHA to the checked-out
# GitHub commit, and refuses a running deployment whose /api/build-info response
# does not expose that same revision. Every protected-main commit triggers a
# serialized run so a newer main tip always supersedes a stale queued deploy.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: killinchu-hf-release-receipt
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  deploy:
    name: Deploy, source-bind, and attest exact surface
    uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml@e3ec47ad2e99a535839afe0f30fefbd8973d52da
    with:
      hf-repo: SZLHOLDINGS/killinchu
      ref: ${{ github.sha }}
      require-default-branch-tip: true
      dockerfile-path: Dockerfile
      include-readme: true
      prune: true
      wait-running: 1200
      restart-space: true
      source-revision-variable: SZL_GIT_SHA
      source-revision-probe-path: /api/build-info
      smoke-paths: '["/","/api/killinchu/healthz","/api/build-info","/console","/defend","/resilience","/api/defend/status","/api/defend/readyz","/api/defend/source","/api/killinchu/v1/code/capabilities","/static/analyst.html","/api/killinchu/v1/defensive-intake/tools"]'
    secrets:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
