name: Sync to HuggingFace Space

# Thin caller for the canonical reusable deployer
# (szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml). Replaces the
# hand-maintained file-allowlist sync with Dockerfile-COPY-derived deploy + a
# post-deploy sha256 attestation against the live Space. The deployer derives the
# exact file set from killinchu's Dockerfile COPY sources, so the on.push.paths
# below are only a cheap trigger, not a correctness dependency.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "serve.py"
      - "**/*.py"
      - "web/**"
      - "static/**"
      - "static-vendor/**"
      - "src/**"
      - "corpus/**"
      - "szl_connectors/**"
      - "*.html"
      - "knowledge.json"
      - "README.md"
      - ".github/workflows/hf-sync.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml@5b0d38fadadc073812bfc6175a1e823cd529939f # main
    secrets: inherit
