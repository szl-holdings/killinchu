name: Sync to HuggingFace Space

# Thin caller for the immutable reusable deployer. It derives the exact Space
# file set from Dockerfile COPY sources, binds SZL_GIT_SHA to the checked-out
# GitHub commit, and refuses a running deployment whose /api/build-info response
# does not expose that same revision. The paths below are only a cheap trigger,
# not a correctness boundary.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "serve.py"
      - "**/*.py"
      - "web/**"
      - "static/**"
      - "static-vendor/**"
      - "src/**"
      - "corpus/**"
      - "szl_connectors/**"
      - "*.html"
      - "knowledge.json"
      - "public-risk-transition.json"
      - "README.md"
      - ".github/workflows/hf-sync.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy, source-bind, and attest exact surface
    uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml@9aa36ed914e88bdef2873b26c022e0cecb1e6ec8
    with:
      hf-repo: SZLHOLDINGS/killinchu
      ref: ${{ github.sha }}
      dockerfile-path: Dockerfile
      include-readme: true
      prune: true
      wait-running: 1200
      source-revision-variable: SZL_GIT_SHA
      source-revision-probe-path: /api/build-info
      smoke-paths: '["/","/api/killinchu/healthz","/api/build-info","/console","/api/killinchu/v1/code/capabilities"]'
    secrets:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}

  verify-risk-status-fails-closed:
    name: Verify public risk status is intentionally unavailable
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require HTTP 503 and the evidence-unproved reason
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(
            curl --fail-with-body --silent --show-error \
              --output "$body" \
              --write-out '%{http_code}' \
              --max-time 30 \
              https://szlholdings-killinchu.hf.space/api/public-risk-status \
            || true
          )"
          test "$code" = "503"
          python - "$body" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          assert payload["status"] == "UNAVAILABLE", payload
          assert payload["reason"] == "CI_ATTESTATION_EVIDENCE_UNPROVED", payload
          PY
