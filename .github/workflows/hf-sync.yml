name: Sync to HuggingFace Space

# Thin caller for the immutable reusable deployer. It derives the exact Space
# file set from Dockerfile COPY sources, binds SZL_GIT_SHA to the checked-out
# GitHub commit, and refuses a running deployment whose /api/build-info response
# does not expose that same revision. The paths below are only a cheap trigger,
# not a correctness boundary.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "serve.py"
      - "**/*.py"
      - "web/**"
      - "static/**"
      - "static-vendor/**"
      - "src/**"
      - "corpus/**"
      - "szl_connectors/**"
      - "*.html"
      - "knowledge.json"
      - "public-risk-transition.json"
      - "README.md"
      - ".github/workflows/hf-sync.yml"
  workflow_dispatch: {}

concurrency:
  group: killinchu-hf-release-receipt
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  preflight:
    name: Require exact current protected main before deployment
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject non-main or stale dispatches before remote mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          source_ref = os.environ["SOURCE_REF"]
          source_sha = os.environ["SOURCE_SHA"]
          if source_ref != "refs/heads/main":
              raise SystemExit(
                  "refusing production deploy from non-main ref: "
                  f"{source_ref!r}"
              )

          request = urllib.request.Request(
              os.environ["GITHUB_API_URL"].rstrip("/")
              + f"/repos/{os.environ['GITHUB_REPOSITORY']}/commits/main",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              current_main = json.load(response).get("sha")
          if current_main != source_sha:
              raise SystemExit(
                  "refusing stale production deploy: "
                  f"current_main={current_main!r} source_sha={source_sha!r}"
              )
          PY

  deploy:
    name: Deploy, source-bind, and attest exact surface
    needs: preflight
    uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml@9aa36ed914e88bdef2873b26c022e0cecb1e6ec8
    with:
      hf-repo: SZLHOLDINGS/killinchu
      ref: ${{ github.sha }}
      dockerfile-path: Dockerfile
      include-readme: true
      prune: true
      wait-running: 1200
      source-revision-variable: SZL_GIT_SHA
      source-revision-probe-path: /api/build-info
      smoke-paths: '["/","/api/killinchu/healthz","/api/build-info","/console","/api/killinchu/v1/code/capabilities"]'
    secrets:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}

  verify-risk-status-fails-closed:
    name: Verify public risk status is intentionally unavailable
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require HTTP 503 and the evidence-unproved reason
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(
            curl --fail-with-body --silent --show-error \
              --output "$body" \
              --write-out '%{http_code}' \
              --max-time 30 \
              https://szlholdings-killinchu.hf.space/api/public-risk-status \
            || true
          )"
          test "$code" = "503"
          python - "$body" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          assert payload["state"] == "UNAVAILABLE", payload
          assert (
              payload["reason_code"] == "CI_ATTESTATION_EVIDENCE_UNPROVED"
          ), payload
          PY

  release-receipt:
    name: Mint and publish exact-source release receipt
    needs: [deploy, verify-risk-status-fails-closed]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download exact deployment evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: hf-deploy-evidence
          path: release-evidence

      - name: Validate and hash exact deployment manifest
        id: manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path("release-evidence/hf-deploy-manifest.json")
          raw = path.read_bytes()
          manifest = json.loads(raw)
          expected = os.environ["SOURCE_SHA"]
          if manifest.get("schema") != 2:
              raise SystemExit("unexpected deployment-manifest schema")
          if manifest.get("github_repo") != "szl-holdings/killinchu":
              raise SystemExit("deployment manifest names the wrong GitHub repository")
          if manifest.get("hf_repo") != "SZLHOLDINGS/killinchu":
              raise SystemExit("deployment manifest names the wrong Hugging Face Space")
          if manifest.get("ref") != expected:
              raise SystemExit("deployment manifest does not bind the exact main SHA")
          if manifest.get("unresolved_sources") != []:
              raise SystemExit("deployment manifest contains unresolved Docker COPY sources")
          digest = hashlib.sha256(raw).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha256={digest}\n")
          PY

      - name: Attest exact deployment manifest with GitHub OIDC
        id: attest
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4.0.0
        with:
          subject-path: release-evidence/hf-deploy-manifest.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Publish receipt reference and verify restarted runtime
        env:
          HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          MANIFEST_SHA256: ${{ steps.manifest.outputs.sha256 }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          SPACE_ID: SZLHOLDINGS/killinchu
          SPACE_BASE_URL: https://szlholdings-killinchu.hf.space
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            "huggingface_hub==1.19.0" "requests==2.32.5"
          python3 - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          import requests
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"].rstrip("\r\n")
          if not token:
              raise SystemExit("HF_TOKEN is not configured")
          source_sha = os.environ["SOURCE_SHA"]
          github_response = requests.get(
              os.environ["GITHUB_API_URL"].rstrip("/")
              + f"/repos/{os.environ['GITHUB_REPOSITORY']}/commits/main",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              timeout=20,
          )
          github_response.raise_for_status()
          current_main = github_response.json().get("sha")
          if current_main != source_sha:
              raise SystemExit(
                  "refusing stale receipt publication: "
                  f"current_main={current_main!r} source_sha={source_sha!r}"
              )

          live_response = requests.get(
              os.environ["SPACE_BASE_URL"].rstrip("/") + "/api/build-info",
              timeout=20,
          )
          live_response.raise_for_status()
          live_revision = live_response.json().get("build", {}).get("revision")
          if live_revision != source_sha:
              raise SystemExit(
                  "refusing receipt publication for a different live deployment: "
                  f"live_revision={live_revision!r} source_sha={source_sha!r}"
              )

          receipt = {
              "schema": "szl.github-oidc-release-attestation/v1",
              "source_revision": source_sha,
              "manifest_sha256": os.environ["MANIFEST_SHA256"],
              "attestation_id": os.environ["ATTESTATION_ID"],
              "attestation_url": os.environ["ATTESTATION_URL"],
          }
          serialized = json.dumps(receipt, sort_keys=True, separators=(",", ":"))
          HfApi(token=token).add_space_variable(
              os.environ["SPACE_ID"],
              key="RELEASE_ATTESTATION",
              value=serialized,
              description="Exact GitHub OIDC release attestation reference",
              token=token,
          )
          Path("release-evidence/release-attestation.json").write_text(
              json.dumps(receipt, indent=2) + "\n",
              encoding="utf-8",
          )

          expected = receipt
          deadline = time.monotonic() + 600
          last_state = "NO_RESPONSE"
          while time.monotonic() < deadline:
              try:
                  response = requests.get(
                      os.environ["SPACE_BASE_URL"].rstrip("/")
                      + "/api/build-info",
                      timeout=20,
                  )
                  if response.status_code == 200:
                      body = response.json()
                      actual = body.get("release_receipt") or {}
                      last_state = str(actual.get("state") or "UNAVAILABLE")
                      if (
                          body.get("receipt_minted") is True
                          and body.get("build", {}).get("revision")
                          == expected["source_revision"]
                          and actual.get("source_revision")
                          == expected["source_revision"]
                          and actual.get("subject_sha256")
                          == expected["manifest_sha256"]
                          and actual.get("attestation_id")
                          == expected["attestation_id"]
                          and actual.get("attestation_url")
                          == expected["attestation_url"]
                      ):
                          Path(
                              "release-evidence/live-receipt-verification.json"
                          ).write_text(
                              json.dumps(body, indent=2) + "\n",
                              encoding="utf-8",
                          )
                          break
              except (requests.RequestException, ValueError, TypeError):
                  last_state = "RESTARTING"
              time.sleep(10)
          else:
              raise SystemExit(
                  "live runtime did not expose the exact attested release receipt; "
                  f"last_state={last_state}"
              )
          PY

      - name: Upload immutable release-receipt evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: killinchu-release-receipt
          path: |
            release-evidence/hf-deploy-manifest.json
            release-evidence/release-attestation.json
            release-evidence/live-receipt-verification.json
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: warn
          retention-days: 90
